# CT-RAMP on Cube — the pipeline every project in projects/ shares.
#
# This is not a project: nothing here names a data source, a forecast year or a
# strategy.  Every scenario in a project's scenarios.yaml overrides the handful
# of addresses marked REQUIRED below -- copy_inputs' `from:` values, model_year,
# env.MODEL_YEAR/FUTURE -- through the same address grammar it uses for
# everything else.  There is no project-level default: a scenario that leaves
# one of these unresolved fails `tm1 scenarios` rather than running with a value
# nobody wrote.  Everything else -- job paths, cwd, commpath, cluster sizes, the
# iterate: shape -- is identical for every CT-RAMP+Cube project, so it lives here
# once instead of being copied into each one.
#
# What the keys mean: docs/running-a-model.md

slack: "minimal"          # "minimal": start, finish, failure only; "verbose" adds every step

logging:
  level: DEBUG            # what reaches the run log; console stays at INFO

# The only machine-specific value a run needs -- a drive letter, set in .env, never
# overridden by a project.
m_drive: "{env:TM1_M_DRIVE}"        # M: = \\models.ad.mtc.ca.gov\data\models

# The run's forecast year, read by Python steps (configure_ctramp) that need it
# typed rather than as an environment string.  No sensible shared default -- every
# scenario must override it (and keep it in step with env.MODEL_YEAR below).
model_year: "REQUIRED: override model_year"

# RunPrepareEmfac.bat picks these from MODEL_YEAR through a table (see the .bat,
# and Asana task "EMFAC version for next SCS") -- a scenario states the looked-up
# value directly rather than this config repeating that table in a second place.
emfac_sb375_version: "REQUIRED: override emfac_sb375_version"
emfac_eir_version: "REQUIRED: override emfac_eir_version"

# Injected per run -- usable below, not settable:
#   run_dir = {env:TM1_RUNS_ROOT}/{scenario}_{NNN}, plus runs_root, project, scenario, run
# {PERIOD} and {iteration} are expanded per step.

# The legacy jobs take parameters from the environment, not argv.  ITER, PREV_ITER, WGT,
# PREV_WGT, SAMPLESHARE and SEED come from the runner per iteration; these are the rest.
# RunModel.bat sliced MODEL_YEAR and FUTURE out of the folder name; stating them is the fix.
env:
  MODEL_YEAR: "REQUIRED: override env.MODEL_YEAR"   # keep in step with model_year above
  FUTURE: "REQUIRED: override env.FUTURE"           # PBA50 is the only value implemented
  EN7: DISABLED             # required: RunModel.bat 115-128 will not start without it; a
                            # scenario turns it on, a project need not
  PATH: "{env:TM1_GAWK_DIR};{env:PATH}"    # gawk, for BuildTransitNetworks.job
  # MAXITERATIONS: 3      # RunModel.bat 135-147 hard-codes these

# ════════════════════════════════════════════════════════════════════════════════════════
# PIPELINE — steps run in the order written.  A single `iterate:` block carries every
# iteration, iteration 0 (the warm start) included: `iteration_zero_begins` marks where
# iteration 0 joins in, and `only_iteration:` / `skip_iteration:` pin a step to, or skip
# it at, iteration 0.  For the four ways to declare a step (job / command / module /
# script) and the rules governing `skip_if_exists:`, see docs/running-a-model.md.
# ════════════════════════════════════════════════════════════════════════════════════════
steps:

  # ── Setup · stage every input the model reads (RunModel.bat steps 1-3) ────────────────

  # RunModel.bat 156-165, plus metrics/ -- which the .bat leaves to whichever summary
  # script runs first.  Cube jobs do not create their own output directories.
  # Nesting is just a longer path.  Per-iteration directories (hwy/iter{N}) are absent
  # because N is not known until the iteration runs, so their steps create them.
  - make_directories:
      dirs:
        - "{run_dir}/hwy"
        - "{run_dir}/trn"
        - "{run_dir}/skims"
        - "{run_dir}/landuse"
        - "{run_dir}/popsyn"
        - "{run_dir}/nonres"
        - "{run_dir}/main"
        - "{run_dir}/logs"
        - "{run_dir}/database"
        - "{run_dir}/logsums"
        - "{run_dir}/metrics"
        - "{run_dir}/core_summaries"
        - "{run_dir}/emfac/emfac_prep"
        - "{run_dir}/offmodel/offmodel_prep"
        - "{run_dir}/offmodel/offmodel_output"

  # SetUpModel.bat step 3: assembles INPUT/ from its real sources and kept as the run's
  # record of what went into it.  Entries run in order.  Directories merge file by file;
  # nothing is overwritten unless an entry says so.  Nothing the model *produces* is
  # staged, so a failure in the steps that build them cannot hide behind a stale file.
  # `copy_input_to_working`, right after this step, is the second half -- INPUT/ into the
  # working directories.
  - copy_inputs:

      # 1. INPUT/ from its real sources.  Each `from:` is the variable of the same
      #    meaning in SetUpModel.bat: INPUT_NETWORK, INPUT_POPLU, NONRES_INPUT_DIR,
      #    LOGSUMS_INPUT_DIR, METRICS_INPUT_DIR, PREV_RUN_DIR, PARAMS.  No project has
      #    a sensible shared default for any of these -- every `from:` below is a
      #    placeholder every scenario in scenarios.yaml must override.

      input_hwy:                        # INPUT_NETWORK/hwy
        from: "REQUIRED: override copy_inputs.input_hwy.from"
        to: "{run_dir}/INPUT/hwy"
      input_trn:                        # INPUT_NETWORK/trn
        from: "REQUIRED: override copy_inputs.input_trn.from"
        to: "{run_dir}/INPUT/trn"

      input_popsyn:                     # INPUT_POPLU/popsyn
        from: "REQUIRED: override copy_inputs.input_popsyn.from"
        to: "{run_dir}/INPUT/popsyn"
      input_landuse:                    # INPUT_POPLU/landuse
        from: "REQUIRED: override copy_inputs.input_landuse.from"
        to: "{run_dir}/INPUT/landuse"
        variant: {}                      # optional: {dest name: path relative to `from`} -- e.g. a parking-strategy tazData.csv
      input_telecommute_max_rate:       # from this checkout, not the M drive
        from: "utilities/telecommute/telecommute_max_rate_county.csv"
        to: "{run_dir}/INPUT/landuse/telecommute_max_rate_county.csv"

      input_nonres:
        from: "REQUIRED: override copy_inputs.input_nonres.from"
        to: "{run_dir}/INPUT/nonres"
      input_logsums:
        from: "REQUIRED: override copy_inputs.input_logsums.from"
        to: "{run_dir}/INPUT/logsums"
      input_metrics:
        from: "REQUIRED: override copy_inputs.input_metrics.from"
        to: "{run_dir}/INPUT/metrics"

      # The air passenger tables are per model year: SetUpModel.bat picks the year's
      # file and drops the prefix.  A different year is five `from:` values, which is
      # what makes this a config line rather than an `if MODEL_YEAR ==` branch.
      input_airpax_ea:
        from: "REQUIRED: override copy_inputs.input_airpax_ea.from"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxEA.tpp"
        overwrite: true                 # lands on top of input_nonres above
      input_airpax_am:
        from: "REQUIRED: override copy_inputs.input_airpax_am.from"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxAM.tpp"
        overwrite: true
      input_airpax_md:
        from: "REQUIRED: override copy_inputs.input_airpax_md.from"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxMD.tpp"
        overwrite: true
      input_airpax_pm:
        from: "REQUIRED: override copy_inputs.input_airpax_pm.from"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxPM.tpp"
        overwrite: true
      input_airpax_ev:
        from: "REQUIRED: override copy_inputs.input_airpax_ev.from"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxEV.tpp"
        overwrite: true

      # The demand iteration 0 assigns, from the previous run's published output.
      # Only its trip tables; `exclude:` is SetUpModel.bat's two `del` lines, done by
      # never copying rather than by deleting afterwards.
      input_warmstart_main:             # PREV_RUN_DIR/OUTPUT/main
        from: "REQUIRED: override copy_inputs.input_warmstart_main.from"
        to: "{run_dir}/INPUT/warmstart/main"
        include: ["*.tpp"]
      input_warmstart_nonres:           # PREV_RUN_DIR/OUTPUT/nonres
        from: "REQUIRED: override copy_inputs.input_warmstart_nonres.from"
        to: "{run_dir}/INPUT/warmstart/nonres"
        include: ["*.tpp"]
        exclude: ["ixDaily2015.tpp", "ixDailyx4.tpp"]

      input_params:                     # PARAMS
        from: "REQUIRED: override copy_inputs.input_params.from"
        to: "{run_dir}/INPUT/params.properties"

      # 2. The model itself, from this checkout.  SetUpModel.bat copied these from
      #    GITHUB_DIR; the repo is the source, so the run carries this branch's code.
      ctramp_model:
        from: "model-files/model"
        to: "{run_dir}/CTRAMP/model"
      ctramp_runtime:
        from: "model-files/runtime"
        to: "{run_dir}/CTRAMP/runtime"
      ctramp_scripts:
        from: "model-files/scripts"
        to: "{run_dir}/CTRAMP/scripts"
      ctramp_metrics:
        from: "utilities/RTP/metrics"
        to: "{run_dir}/CTRAMP/scripts/metrics"
      ctramp_offmodel:
        from: "utilities/RTP/Emissions/Off Model Calculators"
        to: "{run_dir}/CTRAMP/scripts/offmodel"
      # NPA_metrics_Goal_1A_to_1F.py/NPA_metrics_Goal_2.py's own taz -> county
      # lookup, read relative to their own file location (CTRAMP/geographies/,
      # not scripts/metrics/NPA/geographies/) -- not part of ctramp_metrics above,
      # which stops at scripts/metrics/.
      ctramp_geographies:
        from: "utilities/geographies/taz-superdistrict-county.csv"
        to: "{run_dir}/CTRAMP/geographies/taz-superdistrict-county.csv"

  # Empty here on purpose: a project fills this in via its own `scenarios.yaml`
  # `steps:` -- entries it alone needs (a Blueprint strategy override, say), landed
  # after copy_inputs above and before copy_input_to_working below, on top of or
  # beside whatever copy_inputs staged.  Same entry shape and mechanism as
  # copy_inputs, under a name reserved for exactly this.
  - copy_project_inputs: {}

  # INPUT/ is complete the moment copy_inputs/copy_project_inputs finish writing
  # it -- nothing later ever touches it -- so it is published here rather than
  # waiting for publish_outputs at the very end: a run that fails hours later
  # still leaves its input record behind.  Empty here on purpose, same mechanism
  # as publish_outputs, filled in by a project.
  - publish_inputs: {}

  # RunModel.bat 172-178.  A distinct step from copy_inputs above -- that one reaches
  # outside the run for its sources; this one reshuffles what copy_inputs already
  # staged into INPUT/.  Same entry shape, same mechanism (src/tm1/steps/setup.py),
  # different direction.  popsyn is absent on purpose: filterUnconnectedHouseholds.py
  # writes it.
  - copy_input_to_working:
      hwy:
        from: "{run_dir}/INPUT/hwy"
        to: "{run_dir}/hwy"
      trn:
        from: "{run_dir}/INPUT/trn"
        to: "{run_dir}/trn"
      landuse:
        from: "{run_dir}/INPUT/landuse"
        to: "{run_dir}/landuse"
      nonres:
        from: "{run_dir}/INPUT/nonres"
        to: "{run_dir}/nonres"
      warmstart_main:                   # the demand the warm start assigns
        from: "{run_dir}/INPUT/warmstart/main"
        to: "{run_dir}/main"
      warmstart_nonres:                 # merges into nonres/ alongside the entry above
        from: "{run_dir}/INPUT/warmstart/nonres"
        to: "{run_dir}/nonres"
      logsums:
        from: "{run_dir}/INPUT/logsums"
        to: "{run_dir}/logsums"
      metrics:                          # RunMetrics.bat's own `copy INPUT\metrics\BC_config.csv metrics`
        from: "{run_dir}/INPUT/metrics"
        to: "{run_dir}/metrics"

  - configure_ctramp:
      run_dir: "{run_dir}"
      params: "{run_dir}/INPUT/params.properties"
      # num.acc.threads, read by the Java accessibility calculator that RunLogsums.bat
      # runs.  This pipeline does not run it -- Accessibility.job is pure Cube -- so the
      # value is set for faithfulness only, and nothing here consumes it.
      acc_threads: 48
      # Selects HwyIntraStep_48.block: the Cube process numbers HwyAssign allocates per
      # period.  Must not exceed hwy_assign's cluster_nodes, or it addresses processes
      # that were never started.
      intrastep_processes: 48
  - csv_to_dbf:
      command: "CTRAMP/scripts/preprocess/csvToDbf.py"
      args: ["hwy/tolls.csv", "hwy/tolls.dbf"]
  - set_tolls:
      job: "CTRAMP/scripts/preprocess/SetTolls.job"
  - set_hov_xfer_penalties:
      job: "CTRAMP/scripts/preprocess/SetHovXferPenalties.job"
  - create_five_highway_networks:
      job: "CTRAMP/scripts/preprocess/CreateFiveHighwayNetworks.job"
  - hsr_trip_generation:
      job: "CTRAMP/scripts/preprocess/HsrTripGeneration.job"

  # Non-motorized level of service (RunModel.bat step 4).  Free-flow only, so unlike
  # every other skim these need no assignment first.
  - create_nonmotorized_network:
      job: "CTRAMP/scripts/skims/CreateNonMotorizedNetwork.job"
  - nonmotorized_skims:
      job: "CTRAMP/scripts/skims/NonMotorizedSkims.job"

  # ── The feedback loop · four iterations, iteration 0 the warm start (RunIteration.bat) ──
  # One iteration = demand + assignment; demand responds to the skims the previous
  # iteration published.  `count` iterations run in full; iteration 0 -- the warm start --
  # runs only the part at or after `iteration_zero_begins`, since its demand is the
  # previous run's published trip tables (copy_inputs/copy_input_to_working's
  # warmstart_main/nonres), not CT-RAMP's.  `--iterations N` overrides count.
  #
  # DEPARTURE from RunIteration.bat: hwy_skims/accessibility run at the END of each
  # iteration rather than the head of iterations 1-3.  Same inputs either way, but the
  # final iteration's network also gets skimmed, and it lets find_no_access_zones and
  # filter_unconnected_households run pinned to iteration 0 instead of splitting iteration 1.
  - iterate:
      count: 3
      steps:
        # CT-RAMP.  RunIteration.bat also calls RuntimeConfiguration.py --iter here; it
        # sets only the shadow-price properties, which simulate_ctramp writes itself.
        # Iterations 1..count only -- iteration 0's demand comes from copy_inputs'
        # warmstart tables, not from here.
        - simulate_ctramp:
            runtime_dir: "{run_dir}/CTRAMP/runtime"
            host_ip: "localhost"
            threads: 24               # processing.threads per JPPF node, as the .bat sets it
            seed: 0
            shadow_pricing: true      # recomputed every run; nothing is reused
            shadow_price_passes:      # an inner loop of location choice, per global iteration
              first: 4                # iteration 1 starts from zero prices
              subsequent: 2           # later iterations top up the previous one's
              # 4 + 2 + 2 chains to seven; raising it is a convergence run, not a parity run.
            # SampleRate is required, no default.
            sample_rate:              # Per-iteration rate, like the RunModel.bat's values (lines 280, 304, 328).
              1: 0.15
              2: 0.30
              3: 0.50
            components:               # set any to false to skip it
              UsualWorkAndSchoolLocationChoice: true
              AutoOwnership: true
              FreeParking: true
              CoordinatedDailyActivityPattern: true
              IndividualMandatoryTourFrequency: true
              MandatoryTourDepartureTimeAndDuration: true
              MandatoryTourModeChoice: true
              JointTourFrequency: true
              JointTourLocationChoice: true
              JointTourDepartureTimeAndDuration: true
              JointTourModeChoice: true
              IndividualNonMandatoryTourFrequency: true
              IndividualNonMandatoryTourLocationChoice: true
              IndividualNonMandatoryTourDepartureTimeAndDuration: true
              IndividualNonMandatoryTourModeChoice: true
              AtWorkSubTourFrequency: true
              AtWorkSubTourLocationChoice: true
              AtWorkSubTourDepartureTimeAndDuration: true
              AtWorkSubTourModeChoice: true
              StopFrequency: true
              StopLocation: true
        - update_telecommute_en7:     # exits at once when EN7=DISABLED
            command: "CTRAMP/scripts/preprocess/updateTelecommute_forEN7.py"

        # Non-residential models.  IX and truck are full demand models; air passenger and
        # HSR process input tables.  They write their own trip tables, which HwyAssign
        # reads alongside trips{PERIOD}.tpp.
        - ix_forecasts:
            job: "CTRAMP/scripts/nonres/IxForecasts_horizon.job"
        - ix_time_of_day:
            job: "CTRAMP/scripts/nonres/IxTimeOfDay.job"
            cluster_nodes: 5
        - ix_toll_choice:
            job: "CTRAMP/scripts/nonres/IxTollChoice.job"
            cluster_nodes: 5
        - truck_trip_generation:
            job: "CTRAMP/scripts/nonres/TruckTripGeneration.job"
        - truck_trip_distribution:
            job: "CTRAMP/scripts/nonres/TruckTripDistribution.job"
        - truck_time_of_day:
            job: "CTRAMP/scripts/nonres/TruckTimeOfDay.job"
        - truck_toll_choice:
            job: "CTRAMP/scripts/nonres/TruckTollChoice.job"
            cluster_nodes: 5
        - hsr_transit_submode_choice:
            job: "CTRAMP/scripts/nonres/HsrTransitSubmodeChoice.job"
            cluster_nodes: 5
        - move_air_pax_trips:
            job: "CTRAMP/scripts/nonres/MoveAirPaxTrips_IfNoFreePath.job"
            cluster_nodes: 5

        # Highway assignment.
        - prep_assign:                # folds CT-RAMP's trip lists into main/trips{PERIOD}.tpp
            job: "CTRAMP/scripts/assign/PrepAssign.job"
            cluster_nodes: 5
            verify: ["main/trips{PERIOD}.tpp"]   # it exits 0 with no trip lists to read

        # ── iteration_zero_begins · iteration 0 (the warm start) joins the loop here ──
        # Its demand is already staged in main/trips{PERIOD}.tpp -- copy_input_to_working's
        # warmstart_main/warmstart_nonres -- so it needs nothing above this line.
        - iteration_zero_begins:

        - hwy_assign:
            job: "CTRAMP/scripts/assign/HwyAssign.job"
            cluster_nodes: 48       # must match the intrastep range in HwyIntraStep.block

        # Transit assignment (trnAssign.bat).  These run from
        # trn/TransitAssignment.iter{iteration}; their cluster still talks in
        # run_dir/commpath rather than under it.  A single pass, no line-file
        # staging or MSA sub-iteration loop -- transitLines.lin is a plain input,
        # read straight from trn/, since the simplify_transit_master merge.
        - prep_hwy_net:
            job: "CTRAMP/scripts/skims/PrepHwyNet.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            timeout: 1800
        - build_transit_networks:
            job: "CTRAMP/scripts/skims/BuildTransitNetworks.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            timeout: 3600
            # The two files gawk writes.  If TM1_GAWK_DIR is wrong the job still exits
            # 0 -- the shell redirect creates these, empty -- and the failure would
            # otherwise surface in transit_assign, blaming the wrong step.
            verify:
              - "trn/TransitAssignment.iter{iteration}/{PERIOD}_walk_egrlinks.dat"
              - "trn/TransitAssignment.iter{iteration}/{PERIOD}_transit_suplinks_walk.dat"
        - transit_assign:
            job: "CTRAMP/scripts/assign/TransitAssign.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            commpath: "commpath"
            cluster_nodes: 15       # accegg(3) x path(5) tasks per period
        - transit_skims:
            job: "CTRAMP/scripts/skims/TransitSkims.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            commpath: "commpath"
            cluster_nodes: 15
        - copy_transit_skims:        # trnAssign.bat copy-up: iteration dir -> skims/

        # trnAssign.bat's own final-iteration-only block: aggregates each period's
        # per-submode transit links into trnlink{PERIOD}.dbf (aggregateTransitLinks.py,
        # the NetworkWrangler-free replacement for the legacy per-submode merge), then
        # copy_transit_links lifts each up to trn/ -- ConsolidateLoadedTransit.R reads
        # them from there, not the iteration directory. Five steps, not a loop:
        # aggregateTransitLinks.py takes exactly one period per invocation, the same
        # reasoning behind the five prepare_emfac_* steps below. only_iteration: 3
        # matches iterate.count above literally -- like skip_if_exists elsewhere, not
        # `{iteration}`-aware, so --iterations N would need updating too; a known gap.
        - aggregate_transit_links_ea:
            only_iteration: 3
            command: "CTRAMP/scripts/skims/aggregateTransitLinks.py"
            args: ["EA"]
            cwd: "trn/TransitAssignment.iter{iteration}"
            # trnAssign.bat's own `set ALLTRIPMODES=...`, read via os.environ.
            env: {ALLTRIPMODES: "wlk_com_wlk drv_com_wlk wlk_com_drv wlk_hvy_wlk drv_hvy_wlk wlk_hvy_drv wlk_lrf_wlk drv_lrf_wlk wlk_lrf_drv wlk_exp_wlk drv_exp_wlk wlk_exp_drv wlk_loc_wlk drv_loc_wlk wlk_loc_drv"}
        - aggregate_transit_links_am:
            only_iteration: 3
            command: "CTRAMP/scripts/skims/aggregateTransitLinks.py"
            args: ["AM"]
            cwd: "trn/TransitAssignment.iter{iteration}"
            env: {ALLTRIPMODES: "wlk_com_wlk drv_com_wlk wlk_com_drv wlk_hvy_wlk drv_hvy_wlk wlk_hvy_drv wlk_lrf_wlk drv_lrf_wlk wlk_lrf_drv wlk_exp_wlk drv_exp_wlk wlk_exp_drv wlk_loc_wlk drv_loc_wlk wlk_loc_drv"}
        - aggregate_transit_links_md:
            only_iteration: 3
            command: "CTRAMP/scripts/skims/aggregateTransitLinks.py"
            args: ["MD"]
            cwd: "trn/TransitAssignment.iter{iteration}"
            env: {ALLTRIPMODES: "wlk_com_wlk drv_com_wlk wlk_com_drv wlk_hvy_wlk drv_hvy_wlk wlk_hvy_drv wlk_lrf_wlk drv_lrf_wlk wlk_lrf_drv wlk_exp_wlk drv_exp_wlk wlk_exp_drv wlk_loc_wlk drv_loc_wlk wlk_loc_drv"}
        - aggregate_transit_links_pm:
            only_iteration: 3
            command: "CTRAMP/scripts/skims/aggregateTransitLinks.py"
            args: ["PM"]
            cwd: "trn/TransitAssignment.iter{iteration}"
            env: {ALLTRIPMODES: "wlk_com_wlk drv_com_wlk wlk_com_drv wlk_hvy_wlk drv_hvy_wlk wlk_hvy_drv wlk_lrf_wlk drv_lrf_wlk wlk_lrf_drv wlk_exp_wlk drv_exp_wlk wlk_exp_drv wlk_loc_wlk drv_loc_wlk wlk_loc_drv"}
        - aggregate_transit_links_ev:
            only_iteration: 3
            command: "CTRAMP/scripts/skims/aggregateTransitLinks.py"
            args: ["EV"]
            cwd: "trn/TransitAssignment.iter{iteration}"
            env: {ALLTRIPMODES: "wlk_com_wlk drv_com_wlk wlk_com_drv wlk_hvy_wlk drv_hvy_wlk wlk_hvy_drv wlk_lrf_wlk drv_lrf_wlk wlk_lrf_drv wlk_exp_wlk drv_exp_wlk wlk_exp_drv wlk_loc_wlk drv_loc_wlk wlk_loc_drv"}
        - copy_transit_links:
            only_iteration: 3

        # Feedback.  AverageNetworkVolumes runs every iteration; the .bat skips it at
        # iteration 1 and copies instead, and PREV_ITER=0 makes the two equivalent:
        # WGT=1.0/PREV_WGT=0.00 at iteration 1 turns the weighted average into the
        # same copy the .bat performs by hand.
        - stage_loaded_networks:
        - rename_assignment_variables:
            job: "CTRAMP/scripts/feedback/RenameAssignmentVariables.job"

        # Iteration 0 has no earlier iteration to average against -- not even
        # zero-weighted (unlike iteration 1, which points at iteration 0 -- see
        # PER_ITERATION in external.py).  AverageNetworkVolumes/CalculateSpeeds would
        # have nothing to read, so seed_average_networks seeds avgLOAD{P}.net directly
        # from HwyAssign's own (already-congested) output instead -- a different
        # callable, not this step with different config, so it is pinned rather than
        # merged in.
        - seed_average_networks:
            only_iteration: 0
        - average_network_volumes:
            skip_iteration: 0
            job: "CTRAMP/scripts/feedback/AverageNetworkVolumes.job"
        - calculate_speeds:
            skip_iteration: 0
            job: "CTRAMP/scripts/feedback/CalculateSpeeds.job"
            cluster_nodes: 5
        - test_network_convergence:
            job: "CTRAMP/scripts/feedback/TestNetworkConvergence.job"
        - merge_networks:
            job: "CTRAMP/scripts/feedback/MergeNetworks.job"
        - publish_networks:          # hwy/avgLOAD{P}.net -- what the next iteration's skims read

        # Level of service for the NEXT iteration's demand -- and, in the final
        # iteration, for the skims database, which then reflects the finished network.
        # No skip_if_exists on these two, unlike every other expensive step here: their
        # outputs carry no iteration number in the path, so every iteration overwrites
        # them.  An existence check would find iteration 3's skims and skip, leaving
        # iteration 1 to read them instead of iteration 0's -- a re-run that quietly
        # differs from a fresh one.  Rebuilding costs ~4 minutes.
        - hwy_skims:
            job: "CTRAMP/scripts/skims/HwySkims.job"
            cluster_nodes: 5        # DistributeMultistep, one node per period
        - accessibility:
            job: "CTRAMP/scripts/skims/Accessibility.job"

        # One-time pipeline setup pinned to iteration 0 -- not a warm-start substitute
        # like seed_average_networks above, just steps that need iteration 0's skims and
        # must run before iteration 1's demand.  RunIteration.bat 49-57 parks these
        # under `if %ITER%==1`; with iteration 0's skims built above they run here
        # instead.  Once the households are filtered they stay filtered -- refiltering
        # against a later iteration's skims would change the population mid-run.
        - find_no_access_zones:      # zones with no tolled-DA path -> unconnected_zones.csv
            only_iteration: 0
            job: "CTRAMP/scripts/skims/FindNoAccessZones.job"
            verify: ["skims/unconnected_zones.csv", "skims/unconnected_zones.dbf"]
            # The dbf, not the csv: the job *echo*s the csv header before the MATRIX step
            # that does the work, so a failed run leaves a csv behind.  Only MATRIX creates
            # the dbf.
            skip_if_exists: "skims/unconnected_zones.dbf"
        - filter_unconnected_households:  # INPUT/popsyn -> popsyn/, dropping unreachable homes
            only_iteration: 0
            command: "CTRAMP/scripts/preprocess/filterUnconnectedHouseholds.py"
            args: ["popsyn"]
            # The versioned name INPUT ships depends on the project's popsyn release;
            # a project overrides filter_unconnected_households.skip_if_exists to match.
            skip_if_exists: "REQUIRED: override filter_unconnected_households.skip_if_exists"

  # ── Summaries · once, at the end (RunModel.bat steps 11, 17) ──────────────────────────
  - skims_database:
      job: "CTRAMP/scripts/database/SkimsDatabase.job"
  - net2csv_avgload5period:
      job: "CTRAMP/scripts/metrics/net2csv_avgload5period.job"

  # ── EMFAC prep · once, at the end (RunModel.bat step 12; RunPrepareEmfac.bat) ──────────
  # RunPrepareEmfac.bat also has an "on M" branch (its own EMFAC_DIR/EMFAC_SCRIPT_DIR,
  # picked when an OUTPUT\ directory exists) for running against a robocopied M-drive
  # extraction rather than a live run directory.  Not reachable from this harness --
  # every run works from its own run_dir -- so it has no equivalent here.  The .bat's
  # freight-variant rename (setting aside whichever of the with/without-truck speed-bin
  # files WithFreight/NoFreight did not select) is dropped too: purely cosmetic, nothing
  # downstream reads the file it renames.
  - emfac_prep_between_zones:
      command: "CTRAMP/scripts/emfac/BetweenZonesVMT.py"
      skip_if_exists: "emfac/emfac_prep/CreateSpeedBinsBetweenZones_sums.csv"
  - emfac_prep_within_zones:
      job: "CTRAMP/scripts/emfac/CreateSpeedBinsWithinZones.job"
      skip_if_exists: "emfac/emfac_prep/CreateSpeedBinsWithinZones_sums.csv"

  # RunModel.bat 369-370: `call RunPrepareEmfac.bat SB375 WithFreight` / `... EIR
  # WithFreight` -- WithFreight is the only argument either call ever uses, so it
  # is not a config key, just what these steps do.  Five steps, not two calls: the
  # EIR call runs the SB375 call's one invocation, then three more for
  # season=winter and EMFAC2021 (see the .bat's comment "also run SEASON=winter
  # and EMFAC2021") -- each is a distinct argv, so each is its own step.
  #
  # `--emfac_version`, not the .bat's `--emfac`: the script itself only defines
  # the former (argparse resolves the .bat's shorter form by unambiguous
  # prefix, since nothing else starts with `--emfac`), and there is no reason
  # to depend on that abbreviation matching here.
  - prepare_emfac_sb375:
      command: "CTRAMP/scripts/emfac/create_EMFAC_custom_activity_file.py"
      args:
        - "--analysis_type=SB375"
        - "--emfac_version={emfac_sb375_version}"
        - "--run_mode=emissions"
        - "--sub_area=MPO-MTC"
        - "--season=annual"
        - "--VMT_data_type=totalDailyVMT"
        - "--custom_hourly_speed_fractions"
  - prepare_emfac_eir_annual:
      command: "CTRAMP/scripts/emfac/create_EMFAC_custom_activity_file.py"
      args:
        - "--analysis_type=EIR"
        - "--emfac_version={emfac_eir_version}"
        - "--run_mode=emissions"
        - "--sub_area=MPO-MTC"
        - "--season=annual"
        - "--VMT_data_type=totalDailyVMT"
        - "--custom_hourly_speed_fractions"
  - prepare_emfac_eir_winter:
      command: "CTRAMP/scripts/emfac/create_EMFAC_custom_activity_file.py"
      args:
        - "--analysis_type=EIR"
        - "--emfac_version={emfac_eir_version}"
        - "--run_mode=emissions"
        - "--sub_area=MPO-MTC"
        - "--season=winter"
        - "--VMT_data_type=totalDailyVMT"
        - "--custom_hourly_speed_fractions"
  - prepare_emfac_eir_winter_2021:
      command: "CTRAMP/scripts/emfac/create_EMFAC_custom_activity_file.py"
      args:
        - "--analysis_type=EIR"
        - "--emfac_version=2021"
        - "--run_mode=emissions"
        - "--sub_area=MPO-MTC"
        - "--season=winter"
        - "--VMT_data_type=totalDailyVMT"
        - "--custom_hourly_speed_fractions"
  - prepare_emfac_eir_annual_2021:
      command: "CTRAMP/scripts/emfac/create_EMFAC_custom_activity_file.py"
      args:
        - "--analysis_type=EIR"
        - "--emfac_version=2021"
        - "--run_mode=emissions"
        - "--sub_area=MPO-MTC"
        - "--season=annual"
        - "--VMT_data_type=totalDailyVMT"
        - "--custom_hourly_speed_fractions"

  # ── Logsums · once, at the end (RunModel.bat step 13; RunLogsums.bat) ──────────────────
  # find_no_access_zones/filter_unconnected_households (popsyn) above already produced
  # skims/unconnected_zones.dbf and filtered popsyn/ once, at iteration 0 -- RunLogsums.bat
  # calls FindNoAccessZones.job again unconditionally, but against the same skims it read
  # the first time, so re-running it here would be identical work; not repeated.
  - stage_shadow_pricing_for_logsums:
      shadow_pricing_7:
        from: "{run_dir}/main/ShadowPricing_7.csv"
        to: "{run_dir}/logsums/shadowPricing_7.csv"
  - logsums_runtime_configuration:
      command: "CTRAMP/scripts/preprocess/RuntimeConfiguration.py"
      args: ["--logsums"]
  - filter_unconnected_households_for_logsums:
      command: "CTRAMP/scripts/preprocess/filterUnconnectedHouseholds.py"
      args: ["logsum"]
      skip_if_exists: "logsums/accessibilities_dummy_indivTours.csv"
  - compute_logsums:
      runtime_dir: "{run_dir}/CTRAMP/runtime"
      host_ip: "localhost"
      # `skip_if_exists:` is not `{iteration}`-aware (see docs/running-a-model.md),
      # so this names the final iteration -- 3 -- literally, same as the Metrics
      # section below; `--iterations N` just costs a redundant re-run, not a
      # wrong result.
      skip_if_exists: "logsums/indivTripData_3.csv"
  - normalize_popsyn_names:
  - logsum_joiner:
      command: "CTRAMP/scripts/core_summaries/logsumJoiner.R"
      env: {TARGET_DIR: "{run_dir}"}    # RunLogsums.bat's own `set TARGET_DIR=%CD%`
      skip_if_exists: "logsums/mandatoryAccessibilities.csv"
  - accessibility_markets:
      command: "CTRAMP/scripts/core_summaries/AccessibilityMarkets.R"
      env: {TARGET_DIR: "{run_dir}"}
      skip_if_exists: "core_summaries/AccessibilityMarkets.csv"
  - accessibilities_for_baus:
      command: "CTRAMP/scripts/core_summaries/createAccessibilitiesForBAUS.py"
      skip_if_exists: "logsums/subzone_logsums_for_BAUS.csv"

  # ── Core summaries · once, at the end (RunModel.bat step 14; RunCoreSummaries.bat) ─────
  - core_summaries:
      command: "CTRAMP/scripts/core_summaries/CoreSummaries.R"
      env: {TARGET_DIR: "{run_dir}"}    # RunCoreSummaries.bat's own `set TARGET_DIR=%CD%`
      # One representative output stands for all eleven RDATA/csv pairs the script
      # writes together in one pass -- the .bat's own NEED_SUMMARY count does the
      # same thing, just checking all eleven instead of trusting them to be atomic.
      skip_if_exists: "core_summaries/VehicleMilesTraveled.csv"
  # commute_tours_by_inc_tp.r, RunCoreSummaries.bat's next call, is not in this
  # checkout -- CommuteByIncomeByTPHousehold.csv has no script to reproduce it from.
  - consolidate_loaded_transit:
      command: "CTRAMP/scripts/core_summaries/ConsolidateLoadedTransit.R"
      env: {TARGET_DIR: "{run_dir}"}
      skip_if_exists: "trn/trnline.csv"

  # ── Metrics · once, at the end (RunModel.bat step 15; RunMetrics.bat) ──────────────────
  # `skip_if_exists:` is not `{iteration}`-aware (see docs/running-a-model.md) so
  # these name the final iteration -- 3 -- literally, the same number `iterate.count`
  # below states.  `--iterations N` would make a stale one of these look done when
  # it is not; harmless (a step just re-runs) rather than wrong (nothing here feeds
  # back into the model), so it is a known gap, not a blocker.
  - tally_autos:
      command: "CTRAMP/scripts/metrics/tallyAutos.py"
      skip_if_exists: "metrics/autos_owned.csv"
  - tally_parking:
      command: "CTRAMP/scripts/metrics/tallyParking.R"
      skip_if_exists: "metrics/parking_costs_tour.csv"
  - join_trips_with_income:
      command: "CTRAMP/scripts/metrics/joinTripsWithIncome.R"
      env: {TARGET_DIR: "{run_dir}"}
      skip_if_exists: "main/indivTripDataIncome_3.csv"
  - count_trips:
      command: "CTRAMP/scripts/metrics/countTrips.py"
      skip_if_exists: "main/tripsEVinc1.dat"
  - prep_assign_income:
      job: "CTRAMP/scripts/metrics/prepAssignIncome.job"
      skip_if_exists: "main/tripsAM_no_zpv_allinc.tpp"
  - sum_transit_times:
      job: "CTRAMP/scripts/metrics/sumTransitTimes.job"
      skip_if_exists: "metrics/transit_times_by_mode_income.csv"
  - sum_auto_times:
      job: "CTRAMP/scripts/metrics/sumAutoTimes.job"
      skip_if_exists: "metrics/auto_times.csv"
  - sum_nonmot_times:
      job: "CTRAMP/scripts/metrics/sumNonmotTimes.job"
      skip_if_exists: "metrics/nonmot_times.csv"
  # vmt_vht_metrics.csv (hwynet.py) is commented out in RunMetrics.bat itself --
  # its inputs (CollisionLookupFINAL.xlsx, nonRecurringDelayLookup.csv,
  # emissionsLookup.csv) have not been refreshed -- so there is nothing to port;
  # this project's own vmt_vht_metrics (hooks.py) already covers the same ground.
  - quickboards:
      # A bare filename, not "trn/quickboards.xls": QuickBoards.jar derives its own
      # base directory for the ctl's FilePrefix/NodesFile entries from the output
      # file's own directory, not cwd, so a "trn/" prefix here doubles into every
      # relative path the ctl declares. RunMetrics.bat avoids this the same way --
      # a bare name, then its own `move quickboards.xls trn` -- which
      # stage_quickboards below repeats.
      command: "CTRAMP/scripts/metrics/quickboards.bat"
      args: ["CTRAMP/scripts/metrics/quickboards.ctl", "quickboards.xls"]
      skip_if_exists: "trn/quickboards.xls"
  - stage_quickboards:
      skip_if_exists: "trn/quickboards.xls"
  - transit_boardings:
      command: "CTRAMP/scripts/metrics/transit.py"
      args: ["trn/quickboards.xls"]
      skip_if_exists: "metrics/transit_boards_miles.csv"
  - transit_crowding:
      command: "CTRAMP/scripts/metrics/transitcrowding.py"
      args: ["."]
      skip_if_exists: "metrics/transit_crowding.csv"
  # The shapefile export (cube_to_shapefile.py, correspond_link_to_TAZ.py) is not
  # ported: neither script is staged by copy_inputs.ctramp_metrics (they live in
  # utilities/cube-to-shapefile and utilities/geographies, not utilities/RTP/metrics).
  # geopandas is a dependency regardless -- npa_metrics_goal_3 below needs it.
  - topsheet:
      command: "CTRAMP/scripts/metrics/topsheet.R"
      env: {TARGET_DIR: "{run_dir}"}
      skip_if_exists: "metrics/topsheet.csv"
  - npa_metrics_goal_1a_to_1f:
      # RunMetrics.bat's own NPA_metrics block: none of its three calls carry an
      # ERRORLEVEL guard -- "Do not crash on these but try to run them" -- so a
      # failure here does not stop the run.
      command: "CTRAMP/scripts/metrics/NPA/NPA_metrics_Goal_1A_to_1F.py"
      skip_if_exists: "metrics/NPA_Metrics_Goal_1A_to_1F.csv"
      continue_on_error: true
  - npa_metrics_goal_2:
      command: "CTRAMP/scripts/metrics/NPA/NPA_metrics_Goal_2.py"
      skip_if_exists: "metrics/NPA_Metrics_Goal_2.csv"
      continue_on_error: true
  - npa_metrics_goal_3:
      # network_trn_links.shp is never produced (cube_to_shapefile.py needs
      # MTC's NetworkWrangler, not a dependency here), so this one always fails --
      # continue_on_error is why that is fine.
      command: "CTRAMP/scripts/metrics/NPA/NPA_metrics_Goal_3.py"
      skip_if_exists: "metrics/NPA_metrics_Goal_3A_to_3D.csv"
      continue_on_error: true
  - roll_up_metrics:
      # ALL_PROJECT_METRICS_DIR=..\all_project_metrics -- one level above run_dir,
      # which (run_dir having no project segment -- see run/directory.py) is now
      # runs_root itself: one cross-run rollup directory, not one per project.
      command: "CTRAMP/scripts/metrics/RunResults.py"
      args: ["metrics", "../all_project_metrics"]
      # RunResults.py is the PPA benefit-cost comparison script -- it wants a
      # baseline run and PPAMasterInput.xlsx, neither of which a standalone
      # Blueprint run like this one has, and it needs xlwings (Excel COM
      # automation) just to import. RunMetrics.bat calls it with no ERRORLEVEL
      # guard either -- straight through to :cleanup/:success regardless.
      continue_on_error: true

  # ── Scenario metrics · once, at the end (RunModel.bat step 16; RunScenarioMetrics.bat) ─
  # RunScenarioMetrics.bat's first five calls (joinTripsWithIncome.R, countTrips.py,
  # prepAssignIncome.job, sumTransitTimes.job, sumAutoTimes.job) and its
  # net2csv_avgload5period.job check are the same work RunMetrics.bat's port already
  # did above, guarded by the same (or an equivalent) skip_if_exists -- calling them
  # again would just skip immediately. scenarioMetrics.py is the one genuinely new
  # step: it reads what those already produced and rolls it into scenario_metrics.csv.
  - scenario_metrics:
      command: "CTRAMP/scripts/metrics/scenarioMetrics.py"
      skip_if_exists: "metrics/scenario_metrics.csv"

  # ── Off-model · once, at the end (RunModel.bat step 17; RunOffmodel.bat) ───────────────
  # RunModel.bat runs this `if "%runOffModel%"=="Yes"` -- 2035 and 2050 only, per its
  # own comment.  Off by default for the same reason a Blueprint strategy override is:
  # a scenario turns it on for the model years it qualifies for, rather than this
  # config guessing from model_year.  Neither call is skip_if_exists-guarded: the
  # .bat runs both unconditionally every time, unlike everything staged above it.
  - offmodel_prep:
      command: "CTRAMP/scripts/offmodel/offmodel_prep.py"
      enabled: false
  - run_offmodel_calculators:
      command: "CTRAMP/scripts/offmodel/run_offmodel_calculators.py"
      enabled: false

  # ── Cleanup · once, at the end (RunModel.bat step 18) ──────────────────────────────────
  - cleanup_logs:          # sweeps TPPL*.PRN / _cube_*.log out of run_dir into logs/
  - publish_outputs: {}    # empty here on purpose -- a project fills in from/to entries,
                           # same as copy_project_inputs above
