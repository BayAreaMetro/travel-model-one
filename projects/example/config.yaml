# Example Scenario — WFH Policy Boost
#
# Demonstrates how to create a scenario overlay. This scenario applies an EN7-style
# telecommuting encouragement policy that increases WFH rates in San Francisco
# superdistricts (SD 1–6) by adding a utility boost of +0.5.
#
# Only files that differ from the base model need to be included here.
# ActivitySim's config directory chain means any file placed in activitysim/
# will override the same-named file from default-configs/activity/configs/.
#
# Structure:
#   projects/example/
#   ├── scenario_config.yaml          ← pipeline steps + machine paths
#   ├── activitysim/                  ← ActivitySim config overrides
#   │   ├── settings.yaml             ← operational settings (sample size, etc.)
#   │   └── work_from_home.csv        ← WFH utility spec with SF boosts
#   └── populationsim/                ← PopulationSim overrides (empty = use base)

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  MACHINE-SPECIFIC PATHS — edit these for your environment                  │
# └─────────────────────────────────────────────────────────────────────────────┘
ctramp_run: "{env:TM1_CTRAMP_RUN}"   # a finished CT-RAMP run: this project reads its skims and networks

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PIPELINE STEPS                                                            │
# └─────────────────────────────────────────────────────────────────────────────┘
steps:
  # --- 1. Setup: copy inputs + convert Cube skims to OMX for ActivitySim ---
  copy_inputs:
    land_use:
      from: "{ctramp_run}/landuse/tazData.csv"
      to: "{run_dir}/data/land_use.csv"
    households:
      from: "{ctramp_run}/popsyn/hhFile.csv"
      to: "{run_dir}/data/households.csv"
    persons:
      from: "{ctramp_run}/popsyn/personFile.csv"
      to: "{run_dir}/data/persons.csv"

  convert_skims:
    skim_tpp_dir: "{ctramp_run}/skims"
    output: "{run_dir}/data/skims.omx"

  # --- 2. Simulate: run ActivitySim, then feed the assignment loop below ---
  simulate_activitysim:
    iterations: 1  # 0 = static skims; >0 enables the assignment feedback loop below
    activitysim:
      data_dir: "{run_dir}/data"
      output_dir: "{run_dir}/output"
      configs:
        - "projects/example/activitysim"  # ← scenario overrides
        - "default-configs/activity/configs_mp"
        - "default-configs/activity/configs"

    # Highway assignment feedback (used only when iterations > 0).
    # backend "aeq" = open-source AequilibraE (no Cube license); "cube" = legacy loop.
    assignment:
      backend: aeq
      network_csv: "{ctramp_run}/hwy/iter3/avgload5period_vehclasses.csv"
      nonres_dir: "{ctramp_run}/nonres"
      skims_omx: "{run_dir}/data/skims.omx"
      # Cube-free transit LOS skims from the source network (omit to preserve
      # existing transit matrices); built once by scripts/build_aeq_inputs.py
      transit_inputs_dir: "E:/aeq_inputs"
      archive: true
      cores: 48
      max_iter: 100
      gap_target: 0.001
      # --- To use the legacy Cube Voyager loop instead (requires a local Cube
      # install + license): delete/comment the aeq keys above except skims_omx
      # and archive, then uncomment:
      # backend: cube
      # cube_run_dir: "{ctramp_run}"
      # cluster_nodes: 12
      # assign_job: "HwyAssign.job"
      # transit: true
      # transit_nodes: 15
