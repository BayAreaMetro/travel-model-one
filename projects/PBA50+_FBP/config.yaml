# CT-RAMP on 2023 inputs — RunModel.bat, driven by the Python runner instead of cmd.
# Same model, same inputs, same results; only the orchestration changes.
#
# 2023 is the input vintage this project is built from -- the adopted networks and
# land use it points at below.  A case may forecast forward from it (env.MODEL_YEAR),
# so the year names where the project starts, not the only year it can produce.
# What the keys mean: docs/running-a-model.md

slack: "off"              # "minimal": start, finish, failure only; "verbose" adds every step

logging:
  level: DEBUG            # what reaches the run log; console stays at INFO

# The one shorthand this file defines; another would belong here beside it.  Only the
# ROOT is machine-specific -- which network and which land use are spelled out below.
m_drive: "{env:TM1_M_DRIVE}"        # M: = \\models.ad.mtc.ca.gov\data\models

# The run's year, read by Python steps (configure_ctramp) that need it typed rather
# than as an environment string.  Keep this in step with env.MODEL_YEAR below -- a
# case that forecasts forward must override both.
model_year: 2023

# Injected per run -- usable below, not settable:
#   run_dir = {env:TM1_RUNS_ROOT}/{project}/{case}-{NNN}, plus runs_root, project, case, run
# {PERIOD} and {iteration} are expanded per step.

# The legacy jobs take parameters from the environment, not argv.  ITER, PREV_ITER, WGT,
# PREV_WGT, SAMPLESHARE and SEED come from the runner per round; these are the rest.
# RunModel.bat sliced MODEL_YEAR and FUTURE out of the folder name; stating them is the fix.
env:
  MODEL_YEAR: 2023        # IxForecasts_horizon.job grows external trips from a 2021 base;
                          # HsrTripGeneration.job picks its table for the year
  FUTURE: PBA50           # one branch in one job; PBA50 is the only value implemented
  EN7: DISABLED           # required: RunModel.bat 115-128 will not start without it
  PATH: "{env:TM1_GAWK_DIR};{env:PATH}"    # gawk, for BuildTransitNetworks.job
  # MAXITERATIONS: 3      # RunModel.bat 135-147 hard-codes these

# ════════════════════════════════════════════════════════════════════════════════════════
# PIPELINE — steps run in the order written.  `warmstart:` and `iterate:` are the only
# nesting, and they are what decides a step's round.  For the four ways to declare a step
# (job / command / module / script) and the rules governing `skip_if_exists:`, see
# docs/running-a-model.md.
# ════════════════════════════════════════════════════════════════════════════════════════
steps:

  # ── Setup · stage every input the model reads (RunModel.bat steps 1-3) ────────────────

  # RunModel.bat 156-165, plus metrics/ -- which the .bat leaves to whichever summary
  # script runs first.  Cube jobs do not create their own output directories.
  # Nesting is just a longer path.  Per-round directories (hwy/iter{N}) are absent
  # because N is not known until the round runs, so their steps create them.
  - make_directories:
      dirs:
        - "{run_dir}/hwy"
        - "{run_dir}/trn"
        - "{run_dir}/skims"
        - "{run_dir}/landuse"
        - "{run_dir}/popsyn"
        - "{run_dir}/nonres"
        - "{run_dir}/main"
        - "{run_dir}/logs"
        - "{run_dir}/database"
        - "{run_dir}/logsums"
        - "{run_dir}/metrics"

  # SetUpModel.bat step 3, then RunModel.bat 172-178, in one step.  Entries run in order,
  # so INPUT/ is staged before the working directories that read it, and kept as the run's
  # record of what went into it.  Directories merge file by file; nothing is overwritten
  # unless an entry says so.  Nothing the model *produces* is staged, so a failure in the
  # steps that build them cannot hide behind a stale file.
  - copy_inputs:

      # 1. INPUT/ from its real sources.  Each `from:` is the variable of the same
      #    meaning in SetUpModel.bat: INPUT_NETWORK, INPUT_POPLU, NONRES_INPUT_DIR,
      #    LOGSUMS_INPUT_DIR, METRICS_INPUT_DIR, PREV_RUN_DIR, PARAMS.

      input_hwy:                        # INPUT_NETWORK/hwy
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/Networks/BlueprintNetworks_v35/net_2023_Baseline/hwy"
        to: "{run_dir}/INPUT/hwy"
      input_trn:                        # INPUT_NETWORK/trn
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/Networks/BlueprintNetworks_v35/net_2023_Baseline/trn"
        to: "{run_dir}/INPUT/trn"

      input_popsyn:                     # INPUT_POPLU/popsyn
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/LandUse_n_Popsyn/2023_v12/popsyn"
        to: "{run_dir}/INPUT/popsyn"
      input_landuse:                    # INPUT_POPLU/landuse
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/LandUse_n_Popsyn/2023_v12/landuse"
        to: "{run_dir}/INPUT/landuse"
        variant: {}                      # optional: {dest name: path relative to `from`} -- e.g. a parking-strategy tazData.csv
      input_telecommute_max_rate:       # from this checkout, not the M drive
        from: "utilities/telecommute/telecommute_max_rate_county.csv"
        to: "{run_dir}/INPUT/landuse/telecommute_max_rate_county.csv"

      input_nonres:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06"
        to: "{run_dir}/INPUT/nonres"
      input_logsums:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/logsums_dummies/logsums_dummies_v01"
        to: "{run_dir}/INPUT/logsums"
      input_metrics:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/metrics/metrics_02"
        to: "{run_dir}/INPUT/metrics"

      # The air passenger tables are per model year: SetUpModel.bat picks the year's
      # file and drops the prefix.  A different year is five `from:` values, which is
      # what makes this a config line rather than an `if MODEL_YEAR ==` branch.
      input_airpax_ea:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2023b_tripsAirPaxEA.tpp"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxEA.tpp"
        overwrite: true                 # lands on top of input_nonres above
      input_airpax_am:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2023b_tripsAirPaxAM.tpp"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxAM.tpp"
        overwrite: true
      input_airpax_md:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2023b_tripsAirPaxMD.tpp"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxMD.tpp"
        overwrite: true
      input_airpax_pm:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2023b_tripsAirPaxPM.tpp"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxPM.tpp"
        overwrite: true
      input_airpax_ev:
        from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2023b_tripsAirPaxEV.tpp"
        to: "{run_dir}/INPUT/nonres/tripsAirPaxEV.tpp"
        overwrite: true

      # The demand iteration 0 assigns, from the previous run's published output.
      # Only its trip tables; `exclude:` is SetUpModel.bat's two `del` lines, done by
      # never copying rather than by deleting afterwards.
      input_warmstart_main:             # PREV_RUN_DIR/OUTPUT/main
        from: "{m_drive}/Application/Model One/RTP2025/IncrementalProgress/2023_TM161_IPA_35/OUTPUT/main"
        to: "{run_dir}/INPUT/warmstart/main"
        include: ["*.tpp"]
      input_warmstart_nonres:           # PREV_RUN_DIR/OUTPUT/nonres
        from: "{m_drive}/Application/Model One/RTP2025/IncrementalProgress/2023_TM161_IPA_35/OUTPUT/nonres"
        to: "{run_dir}/INPUT/warmstart/nonres"
        include: ["*.tpp"]
        exclude: ["ixDaily2015.tpp", "ixDailyx4.tpp"]

      input_params:                     # PARAMS -- from this checkout
        from: "utilities/RTP/config_RTP2025/params_2023.properties"
        to: "{run_dir}/INPUT/params.properties"

      # 2. The model itself, from this checkout.  SetUpModel.bat copied these from
      #    GITHUB_DIR; the repo is the source, so the run carries this branch's code.
      ctramp_model:
        from: "model-files/model"
        to: "{run_dir}/CTRAMP/model"
      ctramp_runtime:
        from: "model-files/runtime"
        to: "{run_dir}/CTRAMP/runtime"
      ctramp_scripts:
        from: "model-files/scripts"
        to: "{run_dir}/CTRAMP/scripts"
      ctramp_metrics:
        from: "utilities/RTP/metrics"
        to: "{run_dir}/CTRAMP/scripts/metrics"

      # 3. INPUT/ -> the working directories (RunModel.bat 172-178).  popsyn is absent
      #    on purpose: the filter_popsyn step writes it.
      hwy:
        from: "{run_dir}/INPUT/hwy"
        to: "{run_dir}/hwy"
      trn:
        from: "{run_dir}/INPUT/trn"
        to: "{run_dir}/trn"
      landuse:
        from: "{run_dir}/INPUT/landuse"
        to: "{run_dir}/landuse"
      nonres:
        from: "{run_dir}/INPUT/nonres"
        to: "{run_dir}/nonres"
      warmstart_main:                   # the demand the warm start assigns
        from: "{run_dir}/INPUT/warmstart/main"
        to: "{run_dir}/main"
      warmstart_nonres:                 # merges into nonres/ alongside the entry above
        from: "{run_dir}/INPUT/warmstart/nonres"
        to: "{run_dir}/nonres"
      logsums:
        from: "{run_dir}/INPUT/logsums"
        to: "{run_dir}/logsums"

  - configure_ctramp:
      run_dir: "{run_dir}"
      params: "{run_dir}/INPUT/params.properties"
      # num.acc.threads, read by the Java accessibility calculator that RunLogsums.bat
      # runs.  This pipeline does not run it -- Accessibility.job is pure Cube -- so the
      # value is set for faithfulness only, and nothing here consumes it.
      acc_threads: 48
      # Selects HwyIntraStep_48.block: the Cube process numbers HwyAssign allocates per
      # period.  Must not exceed hwy_assign's cluster_nodes, or it addresses processes
      # that were never started.
      intrastep_processes: 48
  # RunModel.bat step 3, at the engine boundary: tolls.csv -> tolls.dbf is native
  # (replacing csvToDbf.py, and with it the dbfpy3 dependency), then the stock Cube
  # jobs run as-is -- SetTolls -> SetHovXferPenalties -> CreateFiveHighwayNetworks,
  # taking hwy/freeflow.net to hwy/withTolls.net and hwy/avgload{EA..EV}.net.
  - build_highway_networks:
      run_dir: "{run_dir}"
  # Replaces HsrTripGeneration.job with cubeio: reads the California HSR model's 2040
  # and 2050 tables and interpolates.  All zero before the 2040 opening year (so, zero
  # for 2023) or when HSR_Interregional_Disable is set in trnParam.block, which
  # configure_ctramp writes.
  - build_hsr_trips:
      from: "{run_dir}/INPUT/nonres"
      to: "{run_dir}/nonres"
      trn_param: "{run_dir}/CTRAMP/scripts/block/trnParam.block"

  # Non-motorized level of service (RunModel.bat step 4).  Free-flow only, so unlike
  # every other skim these need no assignment first, and the feedback loop never
  # touches them.  Stock Cube jobs as-is: CreateNonMotorizedNetwork ->
  # NonMotorizedSkims, producing skims/nonmotskm.tpp (DISTWALK/DISTBIKE/DIST).
  - build_nonmotorized_skims:
      run_dir: "{run_dir}"
  # RunModel.bat step 4.5's transitDwellAccess.py Simple mode, native -- and without
  # NetworkWrangler.  With COMPLEXMODES_DWELL/ACCESS empty (as RunModel.bat ships them)
  # that pass leaves the line data untouched, so the five transitOriginal{PERIOD}.lin are
  # copies of transitLines.lin and of each other.  See the module docstring before
  # enabling the complex dwell modes.
  - build_transit_lines:
      from: "{run_dir}/trn/transitLines.lin"
      to: "{run_dir}/trn"

  # ── Warm start · iteration 0 ──────────────────────────────────────────────────────────
  # RunModel.bat's `set ITER=0` pass: assign the staged demand once, so round 1 has
  # congested skims to read.  Twelve names below repeat in `iterate:` -- same job,
  # different round.
  #
  # DEPARTURE from RunIteration.bat: hwy_skims/accessibility run at the END of each round
  # rather than the head of rounds 1-3.  Same inputs either way, but the final round's
  # network also gets skimmed, and it lets find_no_access_zones and
  # filter_unconnected_households run here instead of splitting round 1.
  - warmstart:

      - hwy_assign:                   # assigns the staged warm-start demand
          job: "CTRAMP/scripts/assign/HwyAssign.job"
          cluster_nodes: 48           # must match the intrastep range in HwyIntraStep.block
          skip_if_exists: "hwy/iter0/LOADEA.net"   # its LOAD nets, after the move below

      # trnAssign.bat, unrolled.  These run from trn/TransitAssignment.iter0; their cluster
      # still talks in run_dir/commpath rather than under it.
      - stage_transit_lines:
      - prep_hwy_net:
          job: "CTRAMP/scripts/skims/PrepHwyNet.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          timeout: 1800
      - build_transit_networks:
          job: "CTRAMP/scripts/skims/BuildTransitNetworks.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          timeout: 3600
          # The two files gawk writes.  If TM1_GAWK_DIR is wrong the job still exits
          # 0 -- the shell redirect creates these, empty -- and the failure would
          # otherwise surface in transit_assign, blaming the wrong step.
          verify:
            - "trn/TransitAssignment.iter{iteration}/{PERIOD}_walk_egrlinks.dat"
            - "trn/TransitAssignment.iter{iteration}/{PERIOD}_transit_suplinks_walk.dat"
          skip_if_exists: "trn/TransitAssignment.iter0/EA_transit_suplinks.dat"
      - transit_assign:
          job: "CTRAMP/scripts/assign/TransitAssign.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          commpath: "commpath"
          cluster_nodes: 15           # accegg(3) x path(5) tasks per period
          skip_if_exists: "trn/TransitAssignment.iter0/trnlinkam_drv_com_wlk.dbf"
      - transit_skims:
          job: "CTRAMP/scripts/skims/TransitSkims.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          commpath: "commpath"
          cluster_nodes: 15
          env:                        # trnAssign.bat's counters; FAST is a single pass
            TRNASSIGNITER: "0"
            PREVTRNASSIGNITER: "NEG1"
          skip_if_exists: "trn/TransitAssignment.iter0/trnskmam_drv_com_wlk.avg.iter0.tpp"
      - copy_transit_skims:           # trnAssign.bat copy-up: iteration dir -> skims/

      # RunIteration.bat 159-200.  stage_loaded_networks moves hwy_assign's LOAD nets into
      # iter0/, so it shares hwy_assign's sentinel: if the nets were moved, both are done.
      - stage_loaded_networks:
          skip_if_exists: "hwy/iter0/LOADEA.net"
      - rename_assignment_variables:
          job: "CTRAMP/scripts/feedback/RenameAssignmentVariables.job"
      - seed_average_networks:        # no earlier round to average against: seed, don't average
      - test_network_convergence:
          job: "CTRAMP/scripts/feedback/TestNetworkConvergence.job"
      - merge_networks:
          job: "CTRAMP/scripts/feedback/MergeNetworks.job"
      - publish_networks:             # hwy/avgLOAD{P}.net -- what the next round's skims read

      # No skip_if_exists on these two, unlike every other expensive step here: their
      # outputs carry no iteration in the path, so every round overwrites them.  An
      # existence check would find round 3's skims and skip, leaving round 1 to read
      # them instead of round 0's -- a re-run that quietly differs from a fresh one.
      # Rebuilding costs ~4 minutes.
      - hwy_skims:
          job: "CTRAMP/scripts/skims/HwySkims.job"
          cluster_nodes: 5            # DistributeMultistep, one node per period
      - accessibility:
          job: "CTRAMP/scripts/skims/Accessibility.job"

      # RunIteration.bat 49-57 parks these under `if %ITER%==1`; with the skims built above
      # they are an ordinary warm-start step.  Once the households are filtered they stay
      # filtered -- refiltering against a later round's skims would change the population
      # mid-run.
      #
      # Native replacement for FindNoAccessZones.job + filterUnconnectedHouseholds.py:
      # scans the AM highway skim for zones with no drivable path (Cube writes 500000
      # where none exists), drops households home-based there, and writes
      # popsyn/hhFile.csv + personFile.csv -- the canonical names CT-RAMP's properties
      # point at.  With zero unconnected zones (the healthy, expected case) the INPUT
      # files are byte-copied through unchanged.
      - filter_popsyn:
          from: "{run_dir}/INPUT/popsyn"
          to: "{run_dir}/popsyn"
          skim: "{run_dir}/skims/HWYSKMAM.tpp"
          max_internal_zone: 1454   # zones 1455+ are externals -- flagged but never filtered
          verify: ["popsyn/hhFile.csv", "popsyn/personFile.csv"]

  # ── The feedback loop · three identical rounds (RunIteration.bat) ─────────────────────
  # One round = demand + assignment; demand responds to the skims the previous round
  # published.  Every round runs every step below, in this order.  `--iterations N`
  # overrides count.
  - iterate:
      count: 3
      steps:
        # CT-RAMP.  RunIteration.bat also calls RuntimeConfiguration.py --iter here; it
        # sets only the shadow-price properties, which simulate_ctramp writes itself.
        - simulate_ctramp:
            runtime_dir: "{run_dir}/CTRAMP/runtime"
            host_ip: "localhost"
            threads: 24               # processing.threads per JPPF node, as the .bat sets it
            seed: 0
            shadow_pricing: true      # recomputed every run; nothing is reused
            shadow_price_passes:      # an inner loop of location choice, per global round
              first: 4                # round 1 starts from zero prices
              subsequent: 2           # later rounds top up the previous round's
              # 4 + 2 + 2 chains to seven; raising it is a convergence run, not a parity run.
            # SampleRate is required, no default.
            # sample_rate: 0.5         # Global rate
            sample_rate:              # Per-round rate, like the RunModel.bat's values (lines 280, 304, 328).
              1: 0.15
              2: 0.30
              3: 0.50
            components:               # set any to false to skip it
              UsualWorkAndSchoolLocationChoice: true
              AutoOwnership: true
              FreeParking: true
              CoordinatedDailyActivityPattern: true
              IndividualMandatoryTourFrequency: true
              MandatoryTourDepartureTimeAndDuration: true
              MandatoryTourModeChoice: true
              JointTourFrequency: true
              JointTourLocationChoice: true
              JointTourDepartureTimeAndDuration: true
              JointTourModeChoice: true
              IndividualNonMandatoryTourFrequency: true
              IndividualNonMandatoryTourLocationChoice: true
              IndividualNonMandatoryTourDepartureTimeAndDuration: true
              IndividualNonMandatoryTourModeChoice: true
              AtWorkSubTourFrequency: true
              AtWorkSubTourLocationChoice: true
              AtWorkSubTourDepartureTimeAndDuration: true
              AtWorkSubTourModeChoice: true
              StopFrequency: true
              StopLocation: true
        - update_telecommute_en7:     # exits at once when EN7=DISABLED
            command: "CTRAMP/scripts/preprocess/updateTelecommute_forEN7.py"

        # Non-residential models.  IX and truck are full demand models; air passenger and
        # HSR process input tables.  They write their own trip tables, which HwyAssign
        # reads alongside trips{PERIOD}.tpp.
        - ix_forecasts:
            job: "CTRAMP/scripts/nonres/IxForecasts_horizon.job"
        - ix_time_of_day:
            job: "CTRAMP/scripts/nonres/IxTimeOfDay.job"
            cluster_nodes: 5
        - ix_toll_choice:
            job: "CTRAMP/scripts/nonres/IxTollChoice.job"
            cluster_nodes: 5
        - truck_trip_generation:
            job: "CTRAMP/scripts/nonres/TruckTripGeneration.job"
        - truck_trip_distribution:
            job: "CTRAMP/scripts/nonres/TruckTripDistribution.job"
        - truck_time_of_day:
            job: "CTRAMP/scripts/nonres/TruckTimeOfDay.job"
        - truck_toll_choice:
            job: "CTRAMP/scripts/nonres/TruckTollChoice.job"
            cluster_nodes: 5
        - hsr_transit_submode_choice:
            job: "CTRAMP/scripts/nonres/HsrTransitSubmodeChoice.job"
            cluster_nodes: 5
        - move_air_pax_trips:
            job: "CTRAMP/scripts/nonres/MoveAirPaxTrips_IfNoFreePath.job"
            cluster_nodes: 5

        # Highway assignment.
        - prep_assign:                # folds CT-RAMP's trip lists into main/trips{PERIOD}.tpp
            job: "CTRAMP/scripts/assign/PrepAssign.job"
            cluster_nodes: 5
            verify: ["main/trips{PERIOD}.tpp"]   # it exits 0 with no trip lists to read
        - hwy_assign:
            job: "CTRAMP/scripts/assign/HwyAssign.job"
            cluster_nodes: 48

        # Transit assignment (trnAssign.bat).
        - stage_transit_lines:
        - prep_hwy_net:
            job: "CTRAMP/scripts/skims/PrepHwyNet.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            timeout: 1800
        - build_transit_networks:
            job: "CTRAMP/scripts/skims/BuildTransitNetworks.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            timeout: 3600
            verify:                     # gawk's output; see the warm start's copy
              - "trn/TransitAssignment.iter{iteration}/{PERIOD}_walk_egrlinks.dat"
              - "trn/TransitAssignment.iter{iteration}/{PERIOD}_transit_suplinks_walk.dat"
        - transit_assign:
            job: "CTRAMP/scripts/assign/TransitAssign.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            commpath: "commpath"
            cluster_nodes: 15
        - transit_skims:
            job: "CTRAMP/scripts/skims/TransitSkims.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            commpath: "commpath"
            cluster_nodes: 15
            env:
              TRNASSIGNITER: "0"
              PREVTRNASSIGNITER: "NEG1"
        - copy_transit_skims:

        # Feedback.  AverageNetworkVolumes runs every round; the .bat skips it at
        # iteration 1 and copies instead, and PREV_ITER=0 makes the two equivalent --
        # see the parity plan, finding 5.
        - stage_loaded_networks:
        - rename_assignment_variables:
            job: "CTRAMP/scripts/feedback/RenameAssignmentVariables.job"
        - average_network_volumes:    # the warm start seeds instead -- no earlier round
            job: "CTRAMP/scripts/feedback/AverageNetworkVolumes.job"
        - calculate_speeds:
            job: "CTRAMP/scripts/feedback/CalculateSpeeds.job"
            cluster_nodes: 5
        - test_network_convergence:
            job: "CTRAMP/scripts/feedback/TestNetworkConvergence.job"
        - merge_networks:
            job: "CTRAMP/scripts/feedback/MergeNetworks.job"
        - publish_networks:

        # Level of service for the NEXT round's demand -- and, in the final round, for
        # the skims database, which then reflects the finished network.
        - hwy_skims:
            job: "CTRAMP/scripts/skims/HwySkims.job"
            cluster_nodes: 5
        - accessibility:
            job: "CTRAMP/scripts/skims/Accessibility.job"

  # ── Summaries · once, at the end (RunModel.bat steps 11, 17) ──────────────────────────
  - skims_database:
      job: "CTRAMP/scripts/database/SkimsDatabase.job"
  - net2csv_avgload5period:
      job: "CTRAMP/scripts/metrics/net2csv_avgload5period.job"

  # Python-native, unlike every step above: `script:` imports and calls with the resolved
  # config rather than spawning a subprocess.  This is the shape #110 converts the legacy
  # steps into.  Position in the list decides pre- or post-processing.
  - vmt_vht_metrics:
      script: "hooks.py:vmt_vht_metrics"
