# PBA50+_FBP: 2035 Final Blueprint no-project run. See README.md for the
# address grammar and the three ways a scenario file may declare scenarios.

2035_TM162_FBP_NoProject:
  description: >
    Plan Bay Area 2050+ Final Blueprint no-project run. Equivalent to 2035_TM161_FBP_NoProject_16
  model_year:     2035
  env.MODEL_YEAR: 2035
  env.FUTURE: PBA50
  # SetUpModel_2035_TM161_FBP_NoProject_16.txt's AddStrategies=No: env.EN7 stays at the
  # shared model's own default (DISABLED) and none of the Blueprint strategy overrides
  # below are turned on -- that's the whole difference from 2035_TM162_FBP_Plan.

  copy_inputs.input_hwy.from:     "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/Networks/BlueprintNetworks_v35/net_2035_Baseline/hwy"
  copy_inputs.input_trn.from:     "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/Networks/BlueprintNetworks_v35/net_2035_Baseline/trn"
  copy_inputs.input_popsyn.from:  "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/LandUse_n_Popsyn/BAUS_NoProject_v10/2035/popsyn"
  copy_inputs.input_landuse.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/LandUse_n_Popsyn/BAUS_NoProject_v10/2035/landuse"
  # No parking-strategy variant here (En9 is a Blueprint strategy, off for NoProject) --
  # the shared model's own default `variant: {}` applies, unlike 2035_TM162_FBP_Plan.
  copy_inputs.input_nonres.from:  "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06"
  copy_inputs.input_logsums.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/logsums_dummies/logsums_dummies_v01"
  copy_inputs.input_metrics.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/metrics/metrics_02"

  copy_inputs.input_airpax_ea.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2035b_tripsAirPaxEA.tpp"
  copy_inputs.input_airpax_am.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2035b_tripsAirPaxAM.tpp"
  copy_inputs.input_airpax_md.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2035b_tripsAirPaxMD.tpp"
  copy_inputs.input_airpax_pm.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2035b_tripsAirPaxPM.tpp"
  copy_inputs.input_airpax_ev.from: "{m_drive}/Application/Model One/RTP2025/INPUT_DEVELOPMENT/nonres/nonres_06/airpax/2035b_tripsAirPaxEV.tpp"

  # PREV_RUN_DIR (Blueprint/2035_TM161_FBP_NoProject_15) is gone -- pulling from
  # NoProject_16's own INPUT/warmstart instead, the same workaround the 2050 scenarios
  # use for their own archived predecessors.
  copy_inputs.input_warmstart_main.from:   "{m_drive}/Application/Model One/RTP2025/Blueprint/2035_TM161_FBP_NoProject_16/INPUT/warmstart/main"
  copy_inputs.input_warmstart_nonres.from: "{m_drive}/Application/Model One/RTP2025/Blueprint/2035_TM161_FBP_NoProject_16/INPUT/warmstart/nonres"

  copy_inputs.input_params.from: "utilities/RTP/config_RTP2025/params_2035_NoProject.properties"

  # The versioned name this project's INPUT/popsyn ships under.
  filter_unconnected_households.skip_if_exists: "popsyn/hhFile.FBP.2035.PBA50Plus_NoProject_v38.csv"

  # RunPrepareEmfac.bat's MODEL_YEAR lookup table, evaluated for 2035 -- same as every
  # other scenario here; this table is keyed on year, not Project/NoProject.
  emfac_sb375_version: "2014"
  emfac_eir_version:   "2017"

  # AddStrategies=No: every Blueprint strategy override and off-model calculator this
  # project declares stays at its shared default (false/disabled) -- nothing to turn on.
