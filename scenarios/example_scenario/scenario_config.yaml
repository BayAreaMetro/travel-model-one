# Example Scenario — WFH Policy Boost
#
# Demonstrates how to create a scenario overlay. This scenario applies an EN7-style
# telecommuting encouragement policy that increases WFH rates in San Francisco
# superdistricts (SD 1–6) by adding a utility boost of +0.5.
#
# Only files that differ from the base model need to be included here.
# ActivitySim's config directory chain means any file placed in activitysim/
# will override the same-named file from default-configs/activity/configs/.
#
# Structure:
#   scenarios/example_scenario/
#   ├── scenario_config.yaml          ← pipeline steps + machine paths
#   ├── activitysim/                  ← ActivitySim config overrides
#   │   ├── settings.yaml             ← operational settings (sample size, etc.)
#   │   └── work_from_home.csv        ← WFH utility spec with SF boosts
#   └── populationsim/                ← PopulationSim overrides (empty = use base)

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  MACHINE-SPECIFIC PATHS — edit these for your environment                  │
# └─────────────────────────────────────────────────────────────────────────────┘
reference_run: "//MODEL3-C/Model3C-Share/Projects/2023_TM161_IPA_35_testrun"
proj_dir: "E:/Tests/example_wfh_boost"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PIPELINE STEPS                                                            │
# └─────────────────────────────────────────────────────────────────────────────┘
steps:
  # --- 1. Setup: copy inputs + convert Cube skims to OMX for ActivitySim ---
  copy_inputs:
    land_use:
      from: "{reference_run}/landuse/tazData.csv"
      to: "{proj_dir}/data/land_use.csv"
    households:
      from: "{reference_run}/popsyn/hhFile.csv"
      to: "{proj_dir}/data/households.csv"
    persons:
      from: "{reference_run}/popsyn/personFile.csv"
      to: "{proj_dir}/data/persons.csv"

  convert_skims:
    skim_tpp_dir: "{reference_run}/skims"
    output: "{proj_dir}/data/skims.omx"

  # --- 2. Simulate: run ActivitySim, then feed the assignment loop below ---
  simulate_activitysim:
    iterations: 1  # 0 = static skims; >0 enables the assignment feedback loop below
    activitysim:
      data_dir: "{proj_dir}/data"
      output_dir: "{proj_dir}/output"
      configs:
        - "scenarios/example_scenario/activitysim"  # ← scenario overrides
        - "default-configs/activity/configs_mp"
        - "default-configs/activity/configs"

    # Highway assignment feedback (used only when iterations > 0).  Same keys and
    # same `backend:` as the CT-RAMP path -- one assignment step, one backend table,
    # whichever demand model is driving.
    assignment:
      backend: cube

      # The Cube project scaffold: hwy nets, CTRAMP/scripts, frozen nonres/ demand.
      # Note this is NOT the run's own proj_dir -- the Cube tree is the reference
      # run, while ActivitySim writes into proj_dir.
      proj_dir: "{reference_run}"

      # The demand this assignment consumes: this round's ActivitySim trip
      # matrices.  `{period}` expands to ea/am/md/pm/ev (`{PERIOD}` gives EA/AM/...).
      # Optional -- defaults to trips_{period}.omx in the ActivitySim output_dir.
      demand: "{proj_dir}/output/trips_{period}.omx"

      # Where the refreshed skims are written back for the next ActivitySim run.
      skims_omx: "{proj_dir}/data/skims.omx"
      archive: true
      cluster_nodes: 12
      assign_job: "HwyAssign.job"
      do_transit: true
      transit_nodes: 15
