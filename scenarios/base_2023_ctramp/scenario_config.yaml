# Base 2023 CTRAMP Scenario — run the legacy Java model via Python orchestration
#
# Same model, same inputs, same results as the batch-file workflow; only the
# orchestration changes (RunModel.bat -> `tm1 run --scenario base_2023_ctramp`).
#
# Runs one full global iteration: CT-RAMP demand -> Cube assignment -> feedback
# -> skims.  Every Cube .job script is the stock one, run unmodified.
#
# Requires Cube Voyager + licence.  Set `reference_run` and `proj_dir` below;
# copy_inputs fetches everything else, so the run is self-contained and
# does not write into the reference run.

slack: "off"

# Every run writes a timestamped log to {proj_dir}/logs/tm1_<stamp>_<pid>.log,
# capturing step boundaries, each Cube job's result and any traceback.  The
# console stays terser than the file.  Both keys are optional.
logging:
  level: DEBUG           # what reaches the file; the console stays at INFO
  # dir: "{proj_dir}/logs"   # uncomment to write run logs somewhere else
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  MACHINE-SPECIFIC PATHS — edit these for your environment                  │
# └─────────────────────────────────────────────────────────────────────────────┘
reference_run: "//MODEL3-C/Model3C-Share/Projects/2023_TM161_IPA_35_testrun"
proj_dir: "E:/Tests/base_2023_ctramp"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  DERIVED PATHS — generally no need to change                               │
# └─────────────────────────────────────────────────────────────────────────────┘
ctramp_output_dir: "{proj_dir}/main"


# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PIPELINE STEPS                                                            │
# └─────────────────────────────────────────────────────────────────────────────┘
# Steps run in the order written.  Each key is a step; the only nesting is
# `iterate:`, whose body is the feedback loop.  A step with a `script:` or
# `module:` key runs your own code -- see `vmt_vht_metrics` at the end.
steps:
  # --- 1. Stage every input the model reads into the project directory ---
  copy_inputs:
    # whole dir: CT-RAMP reads tazData.csv, but the Cube nonres jobs read the
    # .dbf twin (TruckTripGeneration.job -> landuse	azdata.dbf)
    landuse:
      from: "{reference_run}/landuse"
      to: "{proj_dir}/landuse"
    # Warm-start skims for iteration 1's demand models, copied by family so the
    # files the build steps below now produce (nonmotskm.tpp) are not shadowed
    # by stale copies.  The per-class HwySkims intermediates (DA_*, S2_*, ...)
    # are not copied: nothing reads them, each skim pass rewrites them.
    hwy_skims:
      from: "{reference_run}/skims"
      to: "{proj_dir}/skims"
      glob: "HWYSKM*.tpp"
    com_hwy_skims:
      from: "{reference_run}/skims"
      to: "{proj_dir}/skims"
      glob: "COM_HWYSKIM*.tpp"
    transit_skims:
      from: "{reference_run}/skims"
      to: "{proj_dir}/skims"
      glob: "trnskm*.tpp"
    accessibility:
      from: "{reference_run}/skims/accessibility.csv"
      to: "{proj_dir}/skims/accessibility.csv"
    ctramp_model:
      from: "{reference_run}/CTRAMP/model"
      to: "{proj_dir}/CTRAMP/model"
    shadow_prices:
      from: "{reference_run}/main/ShadowPricing_5.csv"
      to: "{proj_dir}/main/ShadowPricing_5.csv"
    ctramp_runtime:
      from: "{reference_run}/CTRAMP/runtime"
      to: "{proj_dir}/CTRAMP/runtime"
    # --- Cube assignment inputs -------------------------------------------
    ctramp_scripts:
      from: "{reference_run}/CTRAMP/scripts"
      to: "{proj_dir}/CTRAMP/scripts"
    # Pristine network inputs; withTolls/avgload{P}.net are *built* by
    # build_highway_networks below, no longer inherited from the reference run.
    hwy_network:
      from: "{reference_run}/INPUT/hwy/freeflow.net"
      to: "{proj_dir}/hwy/freeflow.net"
    hwy_tolls:
      from: "{reference_run}/INPUT/hwy/tolls.csv"
      to: "{proj_dir}/hwy/tolls.csv"
    hwy_turn_penalties:
      from: "{reference_run}/INPUT/hwy"
      to: "{proj_dir}/hwy"
      glob: "turns*.pen"
    nonres:
      from: "{reference_run}/nonres"
      to: "{proj_dir}/nonres"
    # (taxi_tnc_occ_factors.csv is no longer copied -- configure_ctramp derives it
    # from params.properties, which is where the legacy script wrote it from too.)
    # Transit line files, fare tables and support links, from pristine INPUT/.
    # `glob: "*"` takes the top-level files only -- the reference run's
    # TransitAssignment.iter* output directories are skipped, since each
    # iteration rebuilds its own.  transitOriginal{P}.lin is *built* by
    # build_transit_lines below, not inherited.
    trn:
      from: "{reference_run}/INPUT/trn"
      to: "{proj_dir}/trn"
      glob: "*"

  # --- 2. Build the tolled + time-of-day highway networks --------------
  #
  # RunModel.bat step 3, at the engine boundary: tolls.csv -> tolls.dbf is
  # native (replacing csvToDbf.py), then the stock Cube jobs run as-is:
  # SetTolls -> SetHovXferPenalties -> CreateFiveHighwayNetworks, taking
  # hwy/freeflow.net to hwy/withTolls.net and hwy/avgload{EA..EV}.net.
  #
  build_highway_networks:
    proj_dir: "{proj_dir}"

  # --- 3. Build the non-motorized network + walk/bike skims ------------
  #
  # RunModel.bat step 4, stock Cube jobs as-is: CreateNonMotorizedNetwork ->
  # NonMotorizedSkims, producing skims/nonmotskm.tpp (DISTWALK/DISTBIKE/DIST).
  # Built once -- walking and biking do not congest, so the feedback loop
  # never touches it.
  #
  build_nonmotorized_skims:
    proj_dir: "{proj_dir}"

  # --- 4. Stage the synthetic population, filtered for connectivity ----
  #
  # Native replacement for FindNoAccessZones.job + filterUnconnectedHouseholds.py
  # (popsyn mode): scans the AM highway skim for zones with no drivable path
  # (Cube writes 500000 where none exists), drops households home-based there,
  # and writes popsyn/hhFile.csv + personFile.csv -- the canonical names
  # CT-RAMP's properties point at.  With zero unconnected zones (the healthy,
  # expected case) the INPUT files are byte-copied through unchanged.
  #
  filter_popsyn:
    from: "{reference_run}/INPUT/popsyn"
    to: "{proj_dir}/popsyn"
    skim: "{proj_dir}/skims/HWYSKMAM.tpp"
    max_internal_zone: 1454   # zones 1455+ are externals -- flagged but never filtered

  # --- 5. Stamp params.properties into CT-RAMP's config -----------------
  #
  # RunModel.bat step 190's RuntimeConfiguration.py, native.  The shipped
  # properties/blocks/UECs carry `xx.xx` placeholders; this fills them from
  # INPUT/params.properties and writes taxi_tnc_occ_factors.csv.  Patches a
  # key set disjoint from simulate_ctramp's (which owns project dir, popsyn
  # paths, host IP, JPPF and shadow pricing).
  #
  configure_ctramp:
    proj_dir: "{proj_dir}"
    params: "{reference_run}/INPUT/params.properties"
    model_year: 2023

  # --- 6. Stage the per-period transit line files ----------------------
  #
  # RunModel.bat step 4.5's transitDwellAccess.py Simple mode, native -- and
  # without NetworkWrangler.  With COMPLEXMODES_DWELL/ACCESS empty (as
  # RunModel.bat ships them) that pass leaves the line data untouched, so the
  # five transitOriginal{P}.lin are copies of transitLines.lin and of each
  # other.  See the module docstring before enabling the complex dwell modes.
  #
  build_transit_lines:
    from: "{proj_dir}/trn/transitLines.lin"
    to: "{proj_dir}/trn"

  # --- 7. Interpolate high-speed-rail trips to the model year ----------
  #
  # Replaces HsrTripGeneration.job with cubeio: reads the California HSR
  # model's 2040 and 2050 tables and interpolates.  All zero before the 2040
  # opening year (so, zero for 2023) or when HSR_Interregional_Disable is set
  # in trnParam.block, which configure_ctramp writes.
  #
  build_hsr_trips:
    from: "{reference_run}/INPUT/nonres"
    to: "{proj_dir}/nonres"
    model_year: 2023
    trn_param: "{proj_dir}/CTRAMP/scripts/block/trnParam.block"

  # --- 8. The global feedback loop -------------------------------------
  #
  # One iteration = demand + assignment, the body of RunIteration.bat: demand
  # responds to the congested skims the previous assignment produced.  Nesting
  # them here is what makes them a loop; steps outside `iterate` run once.
  # `--iterations N` overrides count.
  #
  iterate:
    count: 1
    steps:
      # --- 8. Simulate: run CTRAMP Java demand model ---
      #
      # Runs one iteration per call; the enclosing `iterate:` block drives the loop.
      # Sample rate follows RunModel.bat's ramp (0.15, 0.30, 0.50 by iteration)
      # unless sample_rate is set.  Shadow pricing is configured per iteration.
      #
      simulate_ctramp:
        project_dir: "{proj_dir}"
        runtime_dir: "{proj_dir}/CTRAMP/runtime"
        host_ip: "localhost"
        threads: 48 # It will reserve 2 threads for infrastructure to leave some headroom.
        # iteration: 3         # pin this step to a specific iteration number; normally
        #                      # the runner supplies it from the enclosing `iterate:` block
        # sample_rate: 0.50    # uncomment to override the default per-iteration ramp
        seed: 0
        shadow_pricing: true   # set false to disable shadow pricing
        # All components enabled for full model run.
        # Set individual components to false to disable them.
        components:
          UsualWorkAndSchoolLocationChoice: true
          AutoOwnership: true
          FreeParking: true
          CoordinatedDailyActivityPattern: true
          IndividualMandatoryTourFrequency: true
          MandatoryTourDepartureTimeAndDuration: true
          MandatoryTourModeChoice: true
          JointTourFrequency: true
          JointTourLocationChoice: true
          JointTourDepartureTimeAndDuration: true
          JointTourModeChoice: true
          IndividualNonMandatoryTourFrequency: true
          IndividualNonMandatoryTourLocationChoice: true
          IndividualNonMandatoryTourDepartureTimeAndDuration: true
          IndividualNonMandatoryTourModeChoice: true
          AtWorkSubTourFrequency: true
          AtWorkSubTourLocationChoice: true
          AtWorkSubTourDepartureTimeAndDuration: true
          AtWorkSubTourModeChoice: true
          StopFrequency: true
          StopLocation: true

      # --- 9. Assignment: Cube highway + transit, then feedback ---
      #
      # Runs RunIteration.bat's Cube half, in its order:
      #   PrepAssign -> HwyAssign -> transit -> feedback -> HwySkims
      # Leaves hwy/avgLOAD{PERIOD}.net and refreshed skims for the next iteration.
      #
      # Needs CTRAMP/scripts, hwy/ and nonres/ in the project dir (copied above).
      #
      assignment:
        proj_dir: "{proj_dir}"

        # The demand this assignment consumes.  The step names the *artifact*, not
        # the step that produced it, so the demand model and the assignment engine
        # meet at a file rather than at each other's internals.  `{PERIOD}` expands
        # to EA/AM/MD/PM/EV.  This is the default and can be omitted; it is written
        # out here because it is the seam the whole pipeline is built around.
        demand: "{proj_dir}/main/trips{PERIOD}.tpp"

        # `model_year` and `future` are legacy names, kept verbatim because the
        # Cube jobs read them as %MODEL_YEAR% / %FUTURE%.  RunModel.bat derives
        # both by slicing the *project folder name* -- "2023_TM161_IPA_35" gives
        # chars 1-4 as the year and chars 12-14 ("IPA") as a project code, which
        # a lookup maps to a FUTURE.  Setting them here instead means a run's
        # results no longer depend on how its output directory is spelled.
        #
        #   model_year  the forecast year, used by IxForecasts_horizon.job to
        #               pick the internal-external trip forecast: 2005 and 2015
        #               are fixed tables, 2021 is the base, and later years are
        #               extrapolated linearly from it (year_delta = year - 2021).
        #               Years before 2021 other than 2015 are not supported.
        #
        #   future      *not* a year -- the name of a planning-scenario family,
        #               selecting which growth assumptions the forecast uses.
        #               IPA/DBP/FBP/EIR/SEN/STP/NGF/TIP/TRR all map to PBA50,
        #               which is the only one implemented.  (PPA runs instead
        #               use RisingTidesFallingFortunes / CleanAndGreen /
        #               BackToTheFuture, chosen by a further two characters of
        #               the folder name.)
        # Which engine solves the assignment.  Cube and AequilibraE solve the
        # same problem -- multi-class user equilibrium over the same network
        # from the same demand -- so switching is a value here, not a different
        # step.  `aeq` arrives with the ActivitySim swap-in, which brings the
        # engine and the OMX demand path it reads.
        backend: cube

        model_year: 2023
        future: PBA50
        do_nonres: true        # internal/external, truck, air passenger, HSR models
        do_transit: true       # transit assignment + skims (15-node cluster)
        build_skims: true      # rebuild highway skims + accessibility afterwards
        cluster_nodes: 48      # must match the intrastep range in HwyIntraStep.block

  # --- 10. Calibration: HTML report comparing survey vs CTRAMP ---
  calibration:
    output_dir: "{proj_dir}/calibration_output"
    write_csv: false

    datasets:
      - label: "BATS_2023"
        format: ctramp
        weight_col:
          wsloc_results: "person_weight"
          cdap_results: "person_weight"
          households: "hh_weight"
          ao_results: "hh_weight"
          indiv_tour_data: "tour_weight"
          joint_tour_data: "tour_weight"
          indiv_trip_data: "trip_weight"
          joint_trip_data: "trip_weight"
        paths:
          households: "{survey_output_dir}/ctramp_2023/HouseholdData.csv"
          persons: "{survey_output_dir}/ctramp_2023/PersonData.csv"
          wsloc_results: "{survey_output_dir}/ctramp_2023/MandatoryLocationData.csv"
          taz_data: "{proj_dir}/landuse/tazData.csv"
          dist_skim: "{reference_run}/skims/nonmotskm.tpp"
          cdap_results: "{survey_output_dir}/ctramp_2023/cdapResults.csv"
          ao_results: "{survey_output_dir}/ctramp_2023/aoResults.csv"
          indiv_tour_data: "{survey_output_dir}/ctramp_2023/IndivTourData.csv"
          indiv_trip_data: "{survey_output_dir}/ctramp_2023/IndivTripData.csv"
          joint_tour_data: "{survey_output_dir}/ctramp_2023/JointTourData.csv"
          joint_trip_data: "{survey_output_dir}/ctramp_2023/JointTripData.csv"

      - label: "CTRAMP"
        format: ctramp
        sampleshare: 0.5
        paths:
          taz_data: "{proj_dir}/landuse/tazData.csv"
          dist_skim: "{reference_run}/skims/nonmotskm.tpp"
          households: "{proj_dir}/popsyn/hhFile.csv"
          wsloc_results: "{ctramp_output_dir}/wsLocResults_3.csv"
          ao_results: "{ctramp_output_dir}/aoResults.csv"
          cdap_results: "{ctramp_output_dir}/cdapResults.csv"
          indiv_tour_data: "{ctramp_output_dir}/indivTourData_3.csv"
          joint_tour_data: "{ctramp_output_dir}/jointTourData_3.csv"
          indiv_trip_data: "{ctramp_output_dir}/indivTripData_3.csv"
          joint_trip_data: "{ctramp_output_dir}/jointTripData_3.csv"

    submodels:
      - work_school_location
      - auto_ownership
      - daily_activity_pattern
      - nonwork_dest_choice
      - tour_mode_choice
      - trip_mode_choice

  # --- 11. Your own code: any step with `script:` or `module:` ---
  #
  # This one runs last, so it is post-processing.  Move it above
  # `simulate_ctramp` and the same mechanism makes it pre-processing -- position
  # in this list is the only thing that decides.
  #
  # `hooks.py:vmt_vht_metrics` names the function; without the `:name` suffix
  # the step calls `run()`, so one file can hold several steps.
  #
  vmt_vht_metrics:
    script: "hooks.py:vmt_vht_metrics"
