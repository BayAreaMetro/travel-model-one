# Base 2023 CTRAMP scenario -- the legacy Java model, run by the Python harness.
#
# Same model, same inputs, same results as RunModel.bat; only the orchestration
# changes.  Every Cube .job is the stock script, unmodified.  Requires Cube
# Voyager + licence.  Set `reference_run` and `proj_dir`; nothing writes into
# the reference run.

slack: "off"

logging:
  level: DEBUG                 # file level; console stays at INFO
  # dir: "{proj_dir}/logs"     # default is {proj_dir}/logs

# --- machine-specific paths --------------------------------------------------
reference_run: "//MODEL3-C/Model3C-Share/Projects/2023_TM161_IPA_35_testrun"
proj_dir: "E:/Tests/base_2023_ctramp"

ctramp_output_dir: "{proj_dir}/main"

# --- pipeline ----------------------------------------------------------------
# Steps run in the order written.  `iterate:` is the only nesting; its body is
# the feedback loop.  A step with `script:`/`module:` runs your own code.
steps:
  # 1. Stage inputs.  No skims are copied: this run builds its own (nonmotskm in
  # build_nonmotorized_skims, the rest in warmstart).  Copying another run's
  # would silently shadow them.
  copy_inputs:
    landuse:                   # whole dir -- the Cube nonres jobs read tazData.dbf
      from: "{reference_run}/landuse"
      to: "{proj_dir}/landuse"
    ctramp_model:
      from: "{reference_run}/CTRAMP/model"
      to: "{proj_dir}/CTRAMP/model"
    ctramp_runtime:
      from: "{reference_run}/CTRAMP/runtime"
      to: "{proj_dir}/CTRAMP/runtime"
    ctramp_scripts:
      from: "{reference_run}/CTRAMP/scripts"
      to: "{proj_dir}/CTRAMP/scripts"
    shadow_prices:
      from: "{reference_run}/main/ShadowPricing_5.csv"
      to: "{proj_dir}/main/ShadowPricing_5.csv"
    hwy_network:               # withTolls/avgload{P}.net are built, not inherited
      from: "{reference_run}/INPUT/hwy/freeflow.net"
      to: "{proj_dir}/hwy/freeflow.net"
    hwy_tolls:
      from: "{reference_run}/INPUT/hwy/tolls.csv"
      to: "{proj_dir}/hwy/tolls.csv"
    hwy_turn_penalties:
      from: "{reference_run}/INPUT/hwy"
      to: "{proj_dir}/hwy"
      glob: "turns*.pen"
    nonres:
      from: "{reference_run}/nonres"
      to: "{proj_dir}/nonres"
    trn:                       # transitOriginal{P}.lin is built by step 5
      from: "{reference_run}/INPUT/trn"
      to: "{proj_dir}/trn"
      glob: "*"

  # 2. RunModel.bat step 3.  tolls.csv -> tolls.dbf is native (replaces
  # csvToDbf.py); SetTolls -> SetHovXferPenalties -> CreateFiveHighwayNetworks
  # are stock Cube jobs.
  build_highway_networks:
    proj_dir: "{proj_dir}"

  # 3. RunModel.bat step 4, stock Cube jobs -> skims/nonmotskm.tpp.  Built once:
  # walking and biking do not congest.
  build_nonmotorized_skims:
    proj_dir: "{proj_dir}"

  # 4. RuntimeConfiguration.py, native.  Fills the xx.xx placeholders in the
  # properties/blocks/UECs and writes taxi_tnc_occ_factors.csv.  Its keys are
  # disjoint from simulate_ctramp's (project dir, popsyn, host IP, JPPF).
  configure_ctramp:
    proj_dir: "{proj_dir}"
    params: "{reference_run}/INPUT/params.properties"
    model_year: 2023

  # 5. transitDwellAccess.py Simple mode, native (no NetworkWrangler).  With
  # COMPLEXMODES_DWELL/ACCESS empty, as RunModel.bat ships them, the five
  # transitOriginal{P}.lin are copies of transitLines.lin -- see the module
  # docstring before enabling complex dwell modes.
  build_transit_lines:
    from: "{proj_dir}/trn/transitLines.lin"
    to: "{proj_dir}/trn"

  # 6. HsrTripGeneration.job via cubeio: interpolates the HSR model's 2040/2050
  # tables.  Zero before the 2040 opening year, or when
  # HSR_Interregional_Disable is set in trnParam.block.
  build_hsr_trips:
    from: "{reference_run}/INPUT/nonres"
    to: "{proj_dir}/nonres"
    model_year: 2023
    trn_param: "{proj_dir}/CTRAMP/scripts/block/trnParam.block"

  # 7. RunModel.bat's iteration 0.  Assigns a previous run's trips once; those
  # skims are what iteration 1 reads.  `from` is that run's INPUT/warmstart, or
  # `coldstart` for zero demand -- which converges but is NOT parity.  Any other
  # missing path errors, so a typo never becomes a silent cold start.  The trips
  # land wherever `assignment`'s `demand:` points.
  warmstart:
    from: "{reference_run}/INPUT/warmstart"
    # from: coldstart

  # 8. FindNoAccessZones.job + filterUnconnectedHouseholds.py, native: drops
  # households whose home TAZ has no drivable path.  After warmstart, because it
  # reads the skims iteration 0 produces.
  filter_popsyn:
    from: "{reference_run}/INPUT/popsyn"
    to: "{proj_dir}/popsyn"
    skim: "{proj_dir}/skims/HWYSKMAM.tpp"
    max_internal_zone: 1454    # 1455+ are externals -- flagged, never filtered

  # 9. The feedback loop -- RunIteration.bat's body, iterations 1..count.
  # `--iterations N` overrides count.
  iterate:
    count: 1
    steps:
      # Sample rate follows RunModel.bat's ramp (0.15/0.30/0.50 by iteration)
      # unless sample_rate is set.
      simulate_ctramp:
        project_dir: "{proj_dir}"
        runtime_dir: "{proj_dir}/CTRAMP/runtime"
        host_ip: "localhost"
        threads: 48            # reserves 2 for infrastructure
        # iteration: 3         # normally supplied by the enclosing `iterate:`
        # sample_rate: 0.50    # overrides the per-iteration ramp
        seed: 0
        shadow_pricing: true
        # Set any component false to skip it.
        components:
          UsualWorkAndSchoolLocationChoice: true
          AutoOwnership: true
          FreeParking: true
          CoordinatedDailyActivityPattern: true
          IndividualMandatoryTourFrequency: true
          MandatoryTourDepartureTimeAndDuration: true
          MandatoryTourModeChoice: true
          JointTourFrequency: true
          JointTourLocationChoice: true
          JointTourDepartureTimeAndDuration: true
          JointTourModeChoice: true
          IndividualNonMandatoryTourFrequency: true
          IndividualNonMandatoryTourLocationChoice: true
          IndividualNonMandatoryTourDepartureTimeAndDuration: true
          IndividualNonMandatoryTourModeChoice: true
          AtWorkSubTourFrequency: true
          AtWorkSubTourLocationChoice: true
          AtWorkSubTourDepartureTimeAndDuration: true
          AtWorkSubTourModeChoice: true
          StopFrequency: true
          StopLocation: true

      # RunIteration.bat's Cube half: PrepAssign -> HwyAssign -> transit ->
      # feedback -> HwySkims.  Leaves hwy/avgLOAD{PERIOD}.net and fresh skims.
      assignment:
        proj_dir: "{proj_dir}"

        # The seam the pipeline is built around: the step names the demand
        # *artifact*, not the step that produced it.  `{PERIOD}` -> EA/AM/MD/PM/EV.
        # This is the default; written out because everything meets here.
        demand: "{proj_dir}/main/trips{PERIOD}.tpp"

        # Cube and AequilibraE solve the same problem, so the engine is a value
        # here rather than a separate step.  `aeq` arrives with ActivitySim.
        backend: cube

        # Legacy names -- the Cube jobs read them as %MODEL_YEAR% / %FUTURE%.
        # RunModel.bat derives both by slicing the project *folder name*; setting
        # them here means results no longer depend on how the directory is spelt.
        #   model_year  forecast year for IxForecasts_horizon.job.  2005 and 2015
        #               are fixed tables, 2021 is the base, later years
        #               extrapolate from it.  Pre-2021 (except 2015) unsupported.
        #   future      a planning-scenario family, not a year.  IPA/DBP/FBP/EIR/
        #               SEN/STP/NGF/TIP/TRR all map to PBA50, the only one built.
        model_year: 2023
        future: PBA50

        do_nonres: true        # internal/external, truck, air passenger, HSR
        do_transit: true       # transit assignment + skims (15-node cluster)
        build_skims: true      # rebuild highway skims + accessibility afterwards
        cluster_nodes: 48      # must match the range in HwyIntraStep.block

  # 10. HTML report comparing the survey against CT-RAMP output.
  calibration:
    output_dir: "{proj_dir}/calibration_output"
    write_csv: false

    datasets:
      - label: "BATS_2023"
        format: ctramp
        weight_col:
          wsloc_results: "person_weight"
          cdap_results: "person_weight"
          households: "hh_weight"
          ao_results: "hh_weight"
          indiv_tour_data: "tour_weight"
          joint_tour_data: "tour_weight"
          indiv_trip_data: "trip_weight"
          joint_trip_data: "trip_weight"
        paths:
          households: "{survey_output_dir}/ctramp_2023/HouseholdData.csv"
          persons: "{survey_output_dir}/ctramp_2023/PersonData.csv"
          wsloc_results: "{survey_output_dir}/ctramp_2023/MandatoryLocationData.csv"
          taz_data: "{proj_dir}/landuse/tazData.csv"
          dist_skim: "{reference_run}/skims/nonmotskm.tpp"
          cdap_results: "{survey_output_dir}/ctramp_2023/cdapResults.csv"
          ao_results: "{survey_output_dir}/ctramp_2023/aoResults.csv"
          indiv_tour_data: "{survey_output_dir}/ctramp_2023/IndivTourData.csv"
          indiv_trip_data: "{survey_output_dir}/ctramp_2023/IndivTripData.csv"
          joint_tour_data: "{survey_output_dir}/ctramp_2023/JointTourData.csv"
          joint_trip_data: "{survey_output_dir}/ctramp_2023/JointTripData.csv"

      - label: "CTRAMP"
        format: ctramp
        sampleshare: 0.5
        paths:
          taz_data: "{proj_dir}/landuse/tazData.csv"
          dist_skim: "{reference_run}/skims/nonmotskm.tpp"
          households: "{proj_dir}/popsyn/hhFile.csv"
          wsloc_results: "{ctramp_output_dir}/wsLocResults_3.csv"
          ao_results: "{ctramp_output_dir}/aoResults.csv"
          cdap_results: "{ctramp_output_dir}/cdapResults.csv"
          indiv_tour_data: "{ctramp_output_dir}/indivTourData_3.csv"
          joint_tour_data: "{ctramp_output_dir}/jointTourData_3.csv"
          indiv_trip_data: "{ctramp_output_dir}/indivTripData_3.csv"
          joint_trip_data: "{ctramp_output_dir}/jointTripData_3.csv"

    submodels:
      - work_school_location
      - auto_ownership
      - daily_activity_pattern
      - nonwork_dest_choice
      - tour_mode_choice
      - trip_mode_choice

  # 11. Your own code.  Position decides when it runs -- last here, so it is
  # post-processing.  The `:name` suffix picks the function; without it, `run()`.
  vmt_vht_metrics:
    script: "hooks.py:vmt_vht_metrics"
