# Base 2023 CT-RAMP — RunModel.bat, driven by the Python runner instead of cmd.
#
# Same model, same inputs, same results: every legacy .job and .py runs unmodified, from
# where it already lives.  Only the orchestration changes.  Steps run in the order written;
# `warmstart:` and `iterate:` are the only nesting, and they are the two blocks that repeat
# or pin a round.
#
# Needs Cube Voyager + licence.  Set reference_run and proj_dir; copy_inputs fetches the
# rest, so a run is self-contained and never writes into the reference run.

slack: "off"

logging:
  level: DEBUG                      # what reaches the run log; console stays at INFO
  # dir: "{proj_dir}/logs"

# ── Machine-specific — set these in .env, not here ──────────────────────────────────────
# {env:NAME} reads the environment, which tm1 populates from .env at the repo root.
# Copy .env.example to .env and fill it in; an unset variable is an error naming it.
# Nothing below this block differs between machines, which is the point.
reference_run: "{env:TM1_REFERENCE_RUN}"    # inputs are copied FROM here; never written to
proj_dir: "{env:TM1_PROJ_DIR}"              # where the run happens

# ── Scenario identity ───────────────────────────────────────────────────────────────────
# Legacy names: the Cube jobs read them as %MODEL_YEAR% / %FUTURE%.  RunModel.bat slices
# both out of the project folder name ("2023_TM161_IPA_35" -> 2023, IPA -> PBA50); stating
# them here means results no longer depend on how a directory is spelled.
#
#   model_year  forecast year.  IxForecasts_horizon.job has fixed tables for 2005/2015,
#               a 2021 base, and extrapolates later years linearly from it.
#   future      a planning-scenario family, not a year.  IPA/DBP/FBP/EIR/SEN/STP/NGF/TIP/
#               TRR all map to PBA50, the only one implemented.
#
# Scenario-level because the pre-process needs them too, before any assignment exists.
model_year: 2023
future: PBA50

# ── Environment the legacy jobs and scripts read ────────────────────────────────────────
# They take parameters from the environment, not argv: HwyAssign reads %ITER%, the feedback
# jobs read %WGT%.  This block is only part of it — ITER, PREV_ITER, WGT, PREV_WGT,
# SAMPLESHARE and SEED come from the runner per round, transcribed from RunModel.bat's four
# iteration blocks.  A step may add its own `env:`, layered on top.  Model parameters only;
# secrets stay in the process environment (see SLACK_WEBHOOK_URL in tm1/slack.py).
env:
  EN7: DISABLED                     # required: RunModel.bat 115-128 will not start without it
  PATH: "{env:TM1_GAWK_DIR};{env:PATH}"      # gawk, for BuildTransitNetworks.job
  # No PYTHONPATH: NetworkWrangler is an ordinary dependency now (see pyproject.toml),
  # and `command:` steps run under this environment's interpreter, so
  # transitDwellAccess.py imports Wrangler from site-packages.
  # MAXITERATIONS: 3                # RunModel.bat 135-147 hard-codes these
  # TRNCONFIG: FAST                 # STANDARD makes transit iterate; not supported yet

ctramp_output_dir: "{proj_dir}/main"

# ════════════════════════════════════════════════════════════════════════════════════════
# PIPELINE
#
# Four ways to declare a step:
#   job:      a Cube .job, run through Cube        \  spawned; paths relative to proj_dir
#   command:  any other program, spawned            /
#   module:   importable dotted path                \  imported and called with the config
#   script:   a .py in this scenario directory      /
#
# Two entries nest, and they decide every step's round:
#   warmstart:  runs its steps once, at iteration 0 — RunModel.bat's `set ITER=0`
#   iterate:    repeats its steps `count` times, rounds 1..count
# Anything written flat runs once, where it sits: round 1 before the loop, the final
# round after it.  Nothing else sets a round; there is no per-step iteration key.
#
# A step outside `iterate:` may also declare:
#   skip_if_exists: F   its work is done when F is on disk; delete F to force a rebuild
#
# A step may only declare skip_if_exists on a file that is ITS product and nobody
# else's.  Naming one a later round overwrites makes the check answer a different
# question -- "does round 3's output exist" -- and skip work that was never done.
# Steps without the key always run: in the warm start below, the seconds-cheap file
# shuffles redo their work harmlessly, and hwy_skims/accessibility rebuild because
# their outputs are not round-specific (see the note there).
# ════════════════════════════════════════════════════════════════════════════════════════
steps:

  # ── Setup · stage every input the model reads (RunModel.bat steps 1-3) ────────────────

  # RunModel.bat 156-165.  Cube jobs do not create their own output directories, and
  # skims/, popsyn/ and database/ have no staged inputs.
  - make_directories:
      module: "tm1.steps.staging:make_directories"
      dirs: [hwy, trn, skims, landuse, popsyn, nonres, main, logs, database, logsums]

  # Entries run in the order written; later ones may read what earlier ones wrote.
  # Directory entries merge file by file and never overwrite.
  #
  # Nothing the model produces is staged -- no skims, accessibility, popsyn or
  # taxi_tnc_occ_factors -- so a failure in the steps that build them cannot hide.
  - copy_inputs:
      # 1. The pristine inputs.  Staged inside proj_dir because the legacy scripts read
      #    INPUT/ by relative path: filterUnconnectedHouseholds reads INPUT/popsyn,
      #    updateTelecommute_forEN7 reads INPUT/landuse and INPUT/params.properties.
      input:
        from: "{reference_run}/INPUT"
        to: "{proj_dir}/INPUT"

      # 2. RunModel.bat 172-178, out of INPUT/ into the working directories.
      hwy:
        from: "{proj_dir}/INPUT/hwy"
        to: "{proj_dir}/hwy"
      trn:
        from: "{proj_dir}/INPUT/trn"
        to: "{proj_dir}/trn"
      landuse:
        from: "{proj_dir}/INPUT/landuse"
        to: "{proj_dir}/landuse"
      nonres:
        from: "{proj_dir}/INPUT/nonres"
        to: "{proj_dir}/nonres"
      warmstart_main:                 # the demand the warm start assigns
        from: "{proj_dir}/INPUT/warmstart/main"
        to: "{proj_dir}/main"
      warmstart_nonres:               # merges into nonres/ alongside the entry above
        from: "{proj_dir}/INPUT/warmstart/nonres"
        to: "{proj_dir}/nonres"
      logsums:
        from: "{proj_dir}/INPUT/logsums"
        to: "{proj_dir}/logsums"

      # 3. The model itself -- code and UECs, not inputs, and not in INPUT/.  A legacy run
      #    has these because the project directory *is* a copy of the model template.
      ctramp_model:
        from: "{reference_run}/CTRAMP/model"
        to: "{proj_dir}/CTRAMP/model"
      ctramp_runtime:
        from: "{reference_run}/CTRAMP/runtime"
        to: "{proj_dir}/CTRAMP/runtime"
      ctramp_scripts:
        from: "{reference_run}/CTRAMP/scripts"
        to: "{proj_dir}/CTRAMP/scripts"

      # Unused: round 1 clears ShadowPrice.Input.File, so prices start from zero.
      # Kept for a future converged file -- see simulate_ctramp.shadow_price_run_notes.
      # shadow_prices:
      #   from: "{reference_run}/main/ShadowPricing_5.csv"
      #   to: "{proj_dir}/main/ShadowPricing_5.csv"

  # RunModel.bat 190's RuntimeConfiguration.py, native.  Stamps params.properties into
  # mtcTourBased.properties, accessibilities.properties, hwyParam.block, trnParam.block
  # and the UEC workbooks, and writes taxi_tnc_occ_factors.csv.
  - configure_ctramp:
      proj_dir: "{proj_dir}"
      params: "{proj_dir}/INPUT/params.properties"
      # num.acc.threads, read by the Java accessibility calculator that RunLogsums.bat
      # runs.  This pipeline does not run it -- Accessibility.job is pure Cube -- so the
      # value is set for faithfulness only, and nothing here consumes it.
      acc_threads: 48
      # Selects HwyIntraStep_48.block: the Cube process numbers HwyAssign allocates per
      # period.  Must not exceed hwy_assign's cluster_nodes, or it addresses processes
      # that were never started.
      intrastep_processes: 48
  - csv_to_dbf:
      command: "CTRAMP/scripts/preprocess/csvToDbf.py"
      args: ["hwy/tolls.csv", "hwy/tolls.dbf"]
  - set_tolls:
      job: "CTRAMP/scripts/preprocess/SetTolls.job"
  - set_hov_xfer_penalties:
      job: "CTRAMP/scripts/preprocess/SetHovXferPenalties.job"
  - create_five_highway_networks:
      job: "CTRAMP/scripts/preprocess/CreateFiveHighwayNetworks.job"
  - hsr_trip_generation:
      job: "CTRAMP/scripts/preprocess/HsrTripGeneration.job"

  # Non-motorized level of service (RunModel.bat step 4).  Free-flow only, so unlike
  # every other skim these need no assignment first.
  - create_nonmotorized_network:
      job: "CTRAMP/scripts/skims/CreateNonMotorizedNetwork.job"
  - nonmotorized_skims:
      job: "CTRAMP/scripts/skims/NonMotorizedSkims.job"
  - transit_dwell_access:
      command: "CTRAMP/scripts/skims/transitDwellAccess.py"
      # The argv the script receives, not a transliteration: RunModel.bat 146-147 set the
      # complex-mode variables to a single space and cmd collapses those, so passing "" here
      # would add arguments the script never saw and crash it on int("").
      args: ["NORMAL", "NoExtraDelay", "Simple", "complexDwell", "complexAccess"]

  # ── Warm start · iteration 0 ──────────────────────────────────────────────────────────
  # RunModel.bat's `set ITER=0` pass: assign the staged demand once, so round 1 has
  # congested skims to read.  Everything CT-RAMP's first run needs is built here --
  # highway skims, transit skims, accessibility, and the filtered synthetic population.
  #
  # These steps run at iteration 0 because they are in this block; that is all `warmstart:`
  # means.  Twelve of the names below also appear in `iterate:` -- same job, different
  # round, its own config.
  #
  # Two departures from RunIteration.bat, both flagged in the parity plan (PR #103):
  # hwy_skims/accessibility run at the END of iteration 0 and of every round (the .bat
  # runs them at the head of rounds 1-3; same inputs either way, but the final round's
  # network also gets skimmed), which is what lets find_no_access_zones and
  # filter_unconnected_households run here instead of splitting round 1.
  - warmstart:

      - hwy_assign:                   # assigns the staged warm-start demand
          job: "CTRAMP/scripts/assign/HwyAssign.job"
          cluster_nodes: 48           # must match the intrastep range in HwyIntraStep.block
          skip_if_exists: "hwy/iter0/LOADEA.net"   # its LOAD nets, after the move below

      # trnAssign.bat, unrolled.  These run from trn/TransitAssignment.iter0; their cluster
      # still talks in proj_dir/commpath rather than under it.
      - stage_transit_lines:
          module: "tm1.steps.staging:stage_transit_lines"
      - prep_hwy_net:
          job: "CTRAMP/scripts/skims/PrepHwyNet.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          timeout: 1800
      - build_transit_networks:
          job: "CTRAMP/scripts/skims/BuildTransitNetworks.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          timeout: 3600
          # The two files gawk writes.  If TM1_GAWK_DIR is wrong the job still exits
          # 0 -- the shell redirect creates these, empty -- and the failure would
          # otherwise surface in transit_assign, blaming the wrong step.
          verify:
            - "trn/TransitAssignment.iter{iteration}/{PERIOD}_walk_egrlinks.dat"
            - "trn/TransitAssignment.iter{iteration}/{PERIOD}_transit_suplinks_walk.dat"
          skip_if_exists: "trn/TransitAssignment.iter0/EA_transit_suplinks.dat"
      - transit_assign:
          job: "CTRAMP/scripts/assign/TransitAssign.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          commpath: "commpath"
          cluster_nodes: 15           # accegg(3) x path(5) tasks per period
          skip_if_exists: "trn/TransitAssignment.iter0/trnlinkam_drv_com_wlk.dbf"
      - transit_skims:
          job: "CTRAMP/scripts/skims/TransitSkims.job"
          cwd: "trn/TransitAssignment.iter{iteration}"
          commpath: "commpath"
          cluster_nodes: 15
          env:                        # trnAssign.bat's counters; FAST is a single pass
            TRNASSIGNITER: "0"
            PREVTRNASSIGNITER: "NEG1"
          skip_if_exists: "trn/TransitAssignment.iter0/trnskmam_drv_com_wlk.avg.iter0.tpp"
      - copy_transit_skims:           # trnAssign.bat copy-up: iteration dir -> skims/
          module: "tm1.steps.staging:copy_transit_skims"

      # RunIteration.bat 159-200.  stage_loaded_networks moves hwy_assign's LOAD nets into
      # iter0/, so it shares hwy_assign's sentinel: if the nets were moved, both are done.
      - stage_loaded_networks:
          module: "tm1.steps.staging:stage_loaded_networks"
          skip_if_exists: "hwy/iter0/LOADEA.net"
      - rename_assignment_variables:
          job: "CTRAMP/scripts/feedback/RenameAssignmentVariables.job"
      - seed_average_networks:        # no earlier round to average against: seed, don't average
          module: "tm1.steps.staging:seed_average_networks"
      - test_network_convergence:
          job: "CTRAMP/scripts/feedback/TestNetworkConvergence.job"
      - merge_networks:
          job: "CTRAMP/scripts/feedback/MergeNetworks.job"
      - publish_networks:             # hwy/avgLOAD{P}.net -- what the next round's skims read
          module: "tm1.steps.staging:publish_networks"

      # No skip_if_exists on these two, unlike every other expensive step here.
      # HwySkims.job writes skims\HWYSKM{PERIOD}.tpp and Accessibility.job writes
      # skims\accessibility.csv -- no iteration in either path, so every loop round
      # overwrites them.  An existence check would find round 3's skims and skip,
      # leaving round 1 to read them instead of round 0's: a re-run that quietly
      # differs from a fresh one.  The steps above can skip because their products
      # (hwy/iter0/, trn/TransitAssignment.iter0/) are round 0's alone.  Rebuilding
      # these costs ~4 minutes on a re-run.
      - hwy_skims:
          job: "CTRAMP/scripts/skims/HwySkims.job"
          cluster_nodes: 5            # DistributeMultistep, one node per period
      - accessibility:
          job: "CTRAMP/scripts/skims/Accessibility.job"

      # RunIteration.bat 49-57 parks these under `if %ITER%==1`; with the skims built above
      # they are ordinary warm-start steps.  Once the households are filtered they stay
      # filtered -- refiltering against a later round's skims would change the population
      # mid-run.
      - find_no_access_zones:         # zones with no tolled-DA path -> unconnected_zones.csv
          job: "CTRAMP/scripts/skims/FindNoAccessZones.job"
          verify: ["skims/unconnected_zones.csv", "skims/unconnected_zones.dbf"]
          # The dbf, not the csv: the job *echo*s the csv header before the MATRIX step
          # that does the work, so a failed run leaves a csv behind.  Only MATRIX creates
          # the dbf.
          skip_if_exists: "skims/unconnected_zones.dbf"
      - filter_unconnected_households:  # INPUT/popsyn -> popsyn/, dropping unreachable homes
          command: "CTRAMP/scripts/preprocess/filterUnconnectedHouseholds.py"
          args: ["popsyn"]
          skip_if_exists: "popsyn/hhFile.2023_v12.csv"   # the versioned name INPUT ships

  # ── The feedback loop · three identical rounds (RunIteration.bat) ─────────────────────
  # One round = demand + assignment; demand responds to the skims the previous round
  # published.  Every round runs every step below, in this order.  `--iterations N`
  # overrides count.
  - iterate:
      count: 3
      steps:
        # CT-RAMP.  RunIteration.bat also calls RuntimeConfiguration.py --iter here; it
        # sets only the shadow-price properties, which simulate_ctramp writes itself.
        - simulate_ctramp:
            project_dir: "{proj_dir}"
            runtime_dir: "{proj_dir}/CTRAMP/runtime"
            host_ip: "localhost"
            threads: 24               # processing.threads per JPPF node, as the .bat sets it
            seed: 0
            shadow_pricing: true      # recomputed every run; nothing is reused
            shadow_price_passes:      # an inner loop of location choice, per global round
              first: 4                # round 1 starts from zero prices
              subsequent: 2           # later rounds top up the previous round's
              # 4 + 2 + 2 chains to seven; raising it is a convergence run, not a parity run.
            # SampleRate is required, no default.
            # sample_rate: 0.5         # Global rate
            sample_rate:              # Per-round rate, like the RunModel.bat's values (lines 280, 304, 328).
              1: 0.15
              2: 0.30
              3: 0.50
            components:               # set any to false to skip it
              UsualWorkAndSchoolLocationChoice: true
              AutoOwnership: true
              FreeParking: true
              CoordinatedDailyActivityPattern: true
              IndividualMandatoryTourFrequency: true
              MandatoryTourDepartureTimeAndDuration: true
              MandatoryTourModeChoice: true
              JointTourFrequency: true
              JointTourLocationChoice: true
              JointTourDepartureTimeAndDuration: true
              JointTourModeChoice: true
              IndividualNonMandatoryTourFrequency: true
              IndividualNonMandatoryTourLocationChoice: true
              IndividualNonMandatoryTourDepartureTimeAndDuration: true
              IndividualNonMandatoryTourModeChoice: true
              AtWorkSubTourFrequency: true
              AtWorkSubTourLocationChoice: true
              AtWorkSubTourDepartureTimeAndDuration: true
              AtWorkSubTourModeChoice: true
              StopFrequency: true
              StopLocation: true
        - update_telecommute_en7:     # exits at once when EN7=DISABLED
            command: "CTRAMP/scripts/preprocess/updateTelecommute_forEN7.py"

        # Non-residential models.  IX and truck are full demand models; air passenger and
        # HSR process input tables.  They write their own trip tables, which HwyAssign
        # reads alongside trips{PERIOD}.tpp.
        - ix_forecasts:
            job: "CTRAMP/scripts/nonres/IxForecasts_horizon.job"
        - ix_time_of_day:
            job: "CTRAMP/scripts/nonres/IxTimeOfDay.job"
            cluster_nodes: 5
        - ix_toll_choice:
            job: "CTRAMP/scripts/nonres/IxTollChoice.job"
            cluster_nodes: 5
        - truck_trip_generation:
            job: "CTRAMP/scripts/nonres/TruckTripGeneration.job"
        - truck_trip_distribution:
            job: "CTRAMP/scripts/nonres/TruckTripDistribution.job"
        - truck_time_of_day:
            job: "CTRAMP/scripts/nonres/TruckTimeOfDay.job"
        - truck_toll_choice:
            job: "CTRAMP/scripts/nonres/TruckTollChoice.job"
            cluster_nodes: 5
        - hsr_transit_submode_choice:
            job: "CTRAMP/scripts/nonres/HsrTransitSubmodeChoice.job"
            cluster_nodes: 5
        - move_air_pax_trips:
            job: "CTRAMP/scripts/nonres/MoveAirPaxTrips_IfNoFreePath.job"
            cluster_nodes: 5

        # Highway assignment.
        - prep_assign:                # folds CT-RAMP's trip lists into main/trips{PERIOD}.tpp
            job: "CTRAMP/scripts/assign/PrepAssign.job"
            cluster_nodes: 5
            verify: ["main/trips{PERIOD}.tpp"]   # it exits 0 with no trip lists to read
        - hwy_assign:
            job: "CTRAMP/scripts/assign/HwyAssign.job"
            cluster_nodes: 48

        # Transit assignment (trnAssign.bat).
        - stage_transit_lines:
            module: "tm1.steps.staging:stage_transit_lines"
        - prep_hwy_net:
            job: "CTRAMP/scripts/skims/PrepHwyNet.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            timeout: 1800
        - build_transit_networks:
            job: "CTRAMP/scripts/skims/BuildTransitNetworks.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            timeout: 3600
            verify:                     # gawk's output; see the warm start's copy
              - "trn/TransitAssignment.iter{iteration}/{PERIOD}_walk_egrlinks.dat"
              - "trn/TransitAssignment.iter{iteration}/{PERIOD}_transit_suplinks_walk.dat"
        - transit_assign:
            job: "CTRAMP/scripts/assign/TransitAssign.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            commpath: "commpath"
            cluster_nodes: 15
        - transit_skims:
            job: "CTRAMP/scripts/skims/TransitSkims.job"
            cwd: "trn/TransitAssignment.iter{iteration}"
            commpath: "commpath"
            cluster_nodes: 15
            env:
              TRNASSIGNITER: "0"
              PREVTRNASSIGNITER: "NEG1"
        - copy_transit_skims:
            module: "tm1.steps.staging:copy_transit_skims"

        # Feedback.  AverageNetworkVolumes runs every round; the .bat skips it at
        # iteration 1 and copies instead, and PREV_ITER=0 makes the two equivalent --
        # see the parity plan, finding 5.
        - stage_loaded_networks:
            module: "tm1.steps.staging:stage_loaded_networks"
        - rename_assignment_variables:
            job: "CTRAMP/scripts/feedback/RenameAssignmentVariables.job"
        - average_network_volumes:    # the warm start seeds instead -- no earlier round
            job: "CTRAMP/scripts/feedback/AverageNetworkVolumes.job"
        - calculate_speeds:
            job: "CTRAMP/scripts/feedback/CalculateSpeeds.job"
            cluster_nodes: 5
        - test_network_convergence:
            job: "CTRAMP/scripts/feedback/TestNetworkConvergence.job"
        - merge_networks:
            job: "CTRAMP/scripts/feedback/MergeNetworks.job"
        - publish_networks:
            module: "tm1.steps.staging:publish_networks"

        # Level of service for the NEXT round's demand -- and, in the final round, for
        # the skims database, which then reflects the finished network.
        - hwy_skims:
            job: "CTRAMP/scripts/skims/HwySkims.job"
            cluster_nodes: 5
        - accessibility:
            job: "CTRAMP/scripts/skims/Accessibility.job"

  # ── Summaries · once, at the end (RunModel.bat steps 11, 17) ──────────────────────────
  - skims_database:
      job: "CTRAMP/scripts/database/SkimsDatabase.job"
  - net2csv_avgload5period:
      job: "CTRAMP/scripts/metrics/net2csv_avgload5period.job"

  # Python-native, unlike every step above: `script:` imports and calls with the resolved
  # config rather than spawning a subprocess.  This is the shape phase 4 converts the
  # legacy steps into.  Position in the list decides pre- or post-processing.
  - vmt_vht_metrics:
      script: "hooks.py:vmt_vht_metrics"
