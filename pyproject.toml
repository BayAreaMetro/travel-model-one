[project]
name = "travel-model-one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.0",
    # `tm1 status` asks whether the process that wrote a run log is still alive.
    # Not os.kill(pid, 0): on Windows that is not a probe, it is TerminateProcess,
    # so the portable-looking idiom would kill the running model.  psutil also
    # supplies create_time(), which is what distinguishes a live run from a
    # recycled PID -- and it already works on Linux, so nothing here has to be
    # unpicked when Cube goes.
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# What the legacy RunModel.bat scripts need, and nothing else does.  Every entry
# exists to run one `command:` step in the CT-RAMP scenario:
#
#   dbfpy3       csvToDbf.py            hwy/tolls.csv -> the .dbf Cube's LOOKUPI reads
#   simpleparse  transitDwellAccess.py  via NetworkWrangler, which is cloned separately
#                                       (see the transit-assignment-env memo)
#   xlrd/xlwt/   RuntimeConfiguration.py  patches costPerMile into the UEC .xls files
#     xlutils
#   pywin32      NetworkWrangler
#
# Phase 4 replaces those scripts with native steps, and this whole extra goes with
# them -- it is complete when no `command:` in any scenario points into CTRAMP/scripts.
legacy = [
    "dbfpy3>=2.3",
    "simpleparse>=2.2",
    "xlrd>=2.0",
    "xlutils>=2.0",
    "xlwt>=1.3",
    "pywin32>=304",
]

[project.scripts]
tm1 = "tm1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-coverage>=0.0",
    "ruff>=0.15.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tm1"]

[tool.ruff]
line-length = 100
lint.select = ["ALL"]
lint.pylint.max-args = 8  # Increase from default of 5 to accomodate 6 canon tables
lint.ignore = [
    "COM812",  # Trailing comma - conflicts with formatter
    "D203",    # Use D211 (no blank line before class)
    "D213",    # Use D212 (summary on first line)
    "RET504",  # Allow return of assigned variable
    "FBT001",  # Boolean args OK in this codebase
    "FBT002",  # Boolean args OK in this codebase
    "ERA001",  # Ignore commented out code
    "FIX002",  # TODOs are tracked in code intentionally
    "TD002",   # TODO author not required
    "TD003",   # TODO issue link not required
    "TC001",   # no `if TYPE_CHECKING:` import blocks -- plain runtime imports preferred
    "TC002",   # (as above)
    "TC003",   # (as above)
    "FA100",   # no `from __future__ import annotations` -- Python floor is 3.11
    "FA102",   # (as above)
]
lint.pydocstyle.convention = "google"
exclude = ["*.html", "uv.lock", "renv", "utilities", "core", "model-files"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "INP001", "D103", "PLR0915"]  # print(), not packages, no docstrings, long mains OK in standalone scripts
"tests/**" = ["T201", "S101", "INP001"]  # Allow print(), assert; not packages
"scenarios/**" = ["T201", "INP001"]  # Scenario step scripts: print() OK, loaded by path not imported as packages