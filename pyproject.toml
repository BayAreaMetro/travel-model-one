[project]
name = "travel-model-one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.31",
    # tm1.steps.configure_ctramp._patch_workbook (native, always runs) reads/writes the
    # UEC workbooks in place, which are still binary .xls -- a format neither openpyxl
    # nor pandas can write.  Not optional: every run reaches this step.
    "xlrd>=2.0",
    "xlutils>=2.0",
    "xlwt>=1.3",
    # create_EMFAC_custom_activity_file.py (a `command:` step, unconditional for
    # every project) reads an .xlsx template -- xlrd 2.0+ dropped that format, so
    # this is a genuinely separate dependency from the .xls trio above, not an
    # overlapping one.
    "openpyxl>=3.1",
    # dbfpy3 backs csvToDbf.py, a `command:` step every project's pipeline runs
    # unconditionally -- it writes hwy/tolls.dbf, which the Cube LOOKUPI in
    # HwyAssign.job reads.  Phase 4 replaces it with a native step and deletes
    # this dependency outright; until then it is load-bearing, not optional, so
    # it lives here rather than in a `legacy` extra someone has to remember to
    # ask for. NetworkWrangler is not: its one unconditional caller
    # (transitDwellAccess.py) is gone as of simplify_transit_master, and no
    # `command:`/`script:` step any project currently declares needs it either
    # -- the couple of utilities/ scripts that still import it are run by hand,
    # outside tm1 entirely, so it is not installed here at all.
    "dbfpy3>=2.3",
    # simpledbf backs aggregateTransitLinks.py's *reads* of Cube's own DBF output --
    # dbfpy3 (above) cannot be reused for this: its validation is too strict for the
    # files Cube writes, which is why the script needs both packages, one per direction.
    "simpledbf>=0.2.6",
    # pyreadr backs npa_metrics_goal_2 (NPA_metrics_Goal_2.py), a `command:` step
    # every project's pipeline runs unconditionally -- it reads updated_output/
    # trips.rdata, which core_summaries writes as R's native format, not a csv.
    "pyreadr>=0.5.3",
]

[project.scripts]
tm1 = "tm1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-coverage>=0.0",
    "ruff>=0.15.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tm1", "src/cube"]

[tool.ruff]
line-length = 100
lint.select = ["ALL"]
lint.pylint.max-args = 8  # Increase from default of 5 to accomodate 6 canon tables
lint.ignore = [
    "COM812",  # Trailing comma - conflicts with formatter
    "D203",    # Use D211 (no blank line before class)
    "D213",    # Use D212 (summary on first line)
    "RET504",  # Allow return of assigned variable
    "FBT001",  # Boolean args OK in this codebase
    "FBT002",  # Boolean args OK in this codebase
    "ERA001",  # Ignore commented out code
    "FIX002",  # TODOs are tracked in code intentionally
    "TD002",   # TODO author not required
    "TD003",   # TODO issue link not required
    "TC001",   # no `if TYPE_CHECKING:` import blocks -- plain runtime imports preferred
    "TC002",   # (as above)
    "TC003",   # (as above)
    "FA100",   # no `from __future__ import annotations` -- Python floor is 3.11
    "FA102",   # (as above)
]
lint.pydocstyle.convention = "google"
exclude = ["*.html", "uv.lock", "renv", "utilities", "core", "model-files"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "INP001", "D103", "PLR0915"]  # print(), not packages, no docstrings, long mains OK in standalone scripts
"tests/**" = ["T201", "S101", "INP001"]  # Allow print(), assert; not packages
"projects/**" = ["T201", "INP001"]  # Project step scripts: print() OK, loaded by path not imported as packages