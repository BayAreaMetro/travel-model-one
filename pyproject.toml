[project]
name = "travel-model-one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "openmatrix>=0.3.5",
    "pandas>=2.0",
    "plotly>=6.7.0",
    "polars>=1.39.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Needed only to run the legacy transit dwell/access feedback (transitDwellAccess.py
# via NetworkWrangler, cloned separately — see the transit-assignment-env memo).
transit = [
    "simpleparse>=2.2",
    "xlrd>=2.0",
    "pywin32>=304",
]
# Editing CT-RAMP's UEC workbooks (configure_ctramp).  xlutils.copy round-trips a
# BIFF .xls through xlwt, the only way to patch one in place without Excel.
# xlrd 2.x dropped .xlsx but still reads .xls with formatting_info, so this shares
# the `transit` extra's floor rather than pinning back to 1.2.  Dies with CT-RAMP.
ctramp = [
    "xlrd>=2.0",
    "xlutils>=2.0",
    "xlwt>=1.3",
]

[project.scripts]
tm1 = "tm1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-coverage>=0.0",
    "ruff>=0.15.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tm1", "src/cubeio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"

[tool.ruff]
line-length = 100
lint.select = ["ALL"]
lint.pylint.max-args = 8  # Increase from default of 5 to accomodate 6 canon tables
lint.ignore = [
    "COM812",  # Trailing comma - conflicts with formatter
    "D203",    # Use D211 (no blank line before class)
    "D213",    # Use D212 (summary on first line)
    "RET504",  # Allow return of assigned variable
    "FBT001",  # Boolean args OK in this codebase
    "FBT002",  # Boolean args OK in this codebase
    "ERA001",  # Ignore commented out code
    "FIX002",  # TODOs are tracked in code intentionally
    "TD002",   # TODO author not required
    "TD003",   # TODO issue link not required
    "TC001",   # no `if TYPE_CHECKING:` import blocks -- plain runtime imports preferred
    "TC002",   # (as above)
    "TC003",   # (as above)
    "FA100",   # no `from __future__ import annotations` -- Python floor is 3.11
    "FA102",   # (as above)
]
lint.pydocstyle.convention = "google"
exclude = ["*.html", "uv.lock", "renv", "utilities", "core", "model-files"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "INP001", "D103", "PLR0915"]  # print(), not packages, no docstrings, long mains OK in standalone scripts
"tests/**" = ["T201", "S101", "INP001"]  # Allow print(), assert; not packages
"scenarios/**" = ["T201", "INP001"]  # Scenario step scripts: print() OK, loaded by path not imported as packages