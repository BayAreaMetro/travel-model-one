# Bounds and initial gamma friction-factor values were informed by the gamma-function
# trip-distribution approach documented in NCHRP Report 365 and FHWA/TMIP guidance.
# The bounds define a plausible calibration search space for the gamma parameters (b,c),
# which are typically negative to produce decreasing friction with increasing impedance.
# Initial values were specified to reflect the expectation that larger truck classes
# generally make longer trips and therefore may exhibit lower impedance sensitivity than
# smaller, more localized truck classes. These values serve only as calibration seed
# parameters; final values are estimated by matching observed truck trip-length
# distributions and average trip lengths. 


model_settings:
  gravity_max_iters: 99              # max IPF iterations per gravity run
  gravity_max_rmse: 10.0             # convergence threshold (RMSE of col sums vs target A)
  optimizer_method: "Nelder-Mead"    # scipy.optimize.minimize method
  optimizer_max_iters: 500           # max optimizer function evaluations
  atl_penalty_weight: 0.1            # weight of Average Trip Length (ATL) penalty term in calibration loss (0.0 to disable)
  gamma_b_bounds: [-3.0, -0.001]     # Based on NCHRP Report 365 - Chapter 12 (p. 146); widened from reported values to allow calibration across multiple truck classes.
  gamma_c_bounds: [-0.5, -0.001]     # Based on NCHRP Report 365 - Chapter 12 (p. 146); widened from reported values to allow calibration across multiple truck classes.
  verbosity: "INFO"                  # logging level: DEBUG, INFO, WARNING
  output_dir: models/trip_distribution

inputs:
  pa_path: data/processed/trip_distribution_inputs/SW_trip_generation_TAZ1454.parquet
  skim_path: data/processed/trip_distribution_inputs/mtc_blended_skims.omx
  # geo_agg_cols:                
  #   - county_id
  #   - district_id

runs:
# DISTANCE-BASED 
  - name: distance_very_small_trucks            # full name, used in output filenames and parquet columns
    short_name: VS_distance                     # used as Excel tab prefix (keep <= 4 chars)
    productions_column: very_small_trucks_production
    attractions_column: very_small_trucks_attraction
    skim_column: blended_distance_vstrucks      # must exist as a table in the OMX file
    gamma_b0: -0.80               # Seed for localized truck travel.
    gamma_c0: -0.10               # Favors shorter trip lengths.
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_distance_vstrucks.csv

  - name: distance_small_trucks            
    short_name: LT_distance                
    productions_column: small_trucks_production
    attractions_column: small_trucks_attraction
    skim_column: blended_distance_strucks      
    gamma_b0: -0.60       # Seed for short-range truck travel.      
    gamma_c0: -0.070      # Moderate trip-length decay.  
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_distance_strucks.csv
    # target_od_path: data/interim/trip_distribution/sw/statewide_od_light.parquet

  - name: distance_medium_trucks
    short_name: MD_distance
    productions_column: medium_trucks_production
    attractions_column: medium_trucks_attraction
    skim_column: blended_distance_mtrucks
    gamma_b0: -0.40  # Seed for regional truck travel.
    gamma_c0: -0.045 # Supports longer trip lengths.
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_distance_mtrucks.csv
    # no target_od_path — OD outputs skipped for this run

  - name: distance_large_trucks
    short_name: HT_distance
    productions_column: large_trucks_production
    attractions_column: large_trucks_attraction
    skim_column: blended_distance_ctrucks
    gamma_b0: -0.20  # Seed for longer-haul truck travel.
    gamma_c0: -0.025 # Slow impedance decay.
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_distance_ctrucks.csv
    # target_od_path: data/interim/trip_distribution/statewide_od_heavy.parquet

  - name: time_small_trucks            
    short_name: LT_time             
    productions_column: small_trucks_production
    attractions_column: small_trucks_attraction
    skim_column: blended_time_strucks    
    gamma_b0: -0.50           
    gamma_c0: -0.05              
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_time_strucks.csv
    # target_od_path: data/interim/trip_distribution/sw/statewide_od_light.parquet

  - name: time_medium_trucks
    short_name: MD_time
    productions_column: medium_trucks_production
    attractions_column: medium_trucks_attraction
    skim_column: blended_time_mtrucks
    gamma_b0: -1.00
    gamma_c0: -0.03
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_time_mtrucks.csv
    # no target_od_path — OD outputs skipped for this run

  - name: time_large_trucks
    short_name: HT_time
    productions_column: large_trucks_production
    attractions_column: large_trucks_attraction
    skim_column: blended_time_ctrucks
    gamma_b0: -1.20
    gamma_c0: -0.02
    tlfd_path: data/processed/trip_distribution_inputs/observed_frequency_distribution_blended_time_ctrucks.csv
