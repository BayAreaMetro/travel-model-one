[project]
name = "calib-report"
version = "0.1.0"
description = "Code for the TM1.7 Calibration Report"
requires-python = ">=3.10"
dependencies = ["pandas", "requests", "tabulate"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calib_report", "calib_report.data"]

[tool.setuptools.package-dir]
"calib_report" = "."
"calib_report.data" = "data"